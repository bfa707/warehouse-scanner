      if (BAD && page && page.fp === BAD) { startOld('эта версия страницы на телефоне не поднялась дважды'); return; }
      newBridge('');                                   // мост — сразу, параллельно странице
      if (page && typeof page.text === 'string' && page.fp && page.fp !== BAD && whlFp(page.text) === page.fp) {
        ST = 'page';
        startPage(page);
        dbg('мост: страница из памяти', PAGE_T - TAP, 'от тапа · ' + Math.round(page.text.length / 1024) + ' К знаков');
      } else {
        ST = 'loading';
        splashSt('Первая загрузка аппки…');
        setTimeout(function () { if (MODE === 'bridge' && ST === 'loading') startOld('первая загрузка не дождалась моста'); }, T.first);
      }
    }
    try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(noop); } catch (e) {}
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(noop); } catch (e) {}
    checkSwitch();
    var off = false; try { off = localStorage.getItem('wh2_off') === '1'; } catch (e) {}
    if (off) {
      // Мост выключен, а владелец велел стереть память пилота — стираем и здесь, всю базу разом [Кодекс, круг 2, LOW-6].
      try {
        var wt = localStorage.getItem('wh2_wipe') || '';
        if (wt) {
          var ks = []; for (var wi = 0; wi < localStorage.length; wi++) { var wk = localStorage.key(wi); if (wk && WIPE_RE.test(wk)) ks.push(wk); }
          ks.forEach(function (k) { localStorage.removeItem(k); });
          try { indexedDB.deleteDatabase('sklad2'); } catch (x) {}
          localStorage.setItem('wh2_wiped', wt); localStorage.removeItem('wh2_wipe');
        }
      } catch (e) {}
      startOld('выключатель version.json'); return;
    }
    if (!window.indexedDB || !window.MessageChannel || typeof Proxy !== 'function') { startOld('браузер не умеет мост'); return; }
    $('splash').addEventListener('click', hideSplash);
    setInterval(noteTick, 1000);
    dbOpen().then(function (db) {
      DB = db;
      return Promise.all([dbGet('page').catch(noop), dbGet('fresh').catch(noop), dbGet('bad').catch(noop)]);
    }).then(function (a) { begin(a[0], a[1], a[2]); }, function () { begin(null, null, null); });
  })();
  </script>
