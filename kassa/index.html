<title>Касса</title>

<!-- 🧾 «КАССА» — СТРАНИЦА ВЫДАЧИ ЗАКАЗА (25.09.2026)
     [владелец: «кассиру нужен только поиск и выдача» — клиент не должен ждать у кассы, пока грузится аппка]
     Страница и список заказов лежат В ТЕЛЕФОНЕ (сторож sw.js + IndexedDB): иконка открывается за доли
     секунды, поиск идёт по списку без Google. Google спрашиваем только ФОНОМ — освежить список
     (двери kassa_tables / kassa_pack склада, apps-script/kassa.js).
     Вход — по ключу телефона после решётки (#k=…), тот же ключ, что у ярлыка склада: отзыв телефона
     закрывает и кассу. Ключ после «#» браузер не отправляет на GitHub.
     ⛔️ Данные клиентов в разметку попадают ТОЛЬКО через textContent — никакого innerHTML с данными. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root { --ink: #1a1a1a; --mute: #6b6b6b; --line: #e6e6e6; --bg: #ffffff; --soft: #f4f4f4;
          --ok: #1b7f3b; --okbg: #e4f4e8; --warn: #8a5a00; --warnbg: #fff3d6; --bad: #b00020; --badbg: #fde6e9;
          --blue: #0b57d0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100%;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overflow: hidden; }
  #top { padding: 10px 16px 6px; border-bottom: 1px solid var(--line); }
  #disp { display: flex; align-items: center; gap: 10px; }
  #num { flex: 1; font-size: 40px; font-weight: 800; letter-spacing: 1px; min-height: 52px; line-height: 52px;
         padding: 0 12px; border-radius: 12px; background: var(--soft); overflow: hidden; white-space: nowrap; }
  #num.ph { color: #b3b3b3; font-weight: 600; font-size: 26px; }
  #sync { margin-top: 6px; font-size: 13px; color: var(--mute); min-height: 18px; }
  #sync.bad { color: var(--bad); } #sync.warn { color: var(--warn); }
  #out { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px 16px; }
  #pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 16px 10px;
         border-top: 1px solid var(--line); background: #fafafa; }
  #pad button { font-size: 28px; font-weight: 700; height: 58px; border: 0; border-radius: 12px;
                background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  #pad button:active { background: #eaeaea; }
  #pad .go { background: var(--ink); color: #fff; font-size: 22px; }
  #pad .del { font-size: 24px; color: var(--mute); }
  #again { display: none; margin: 8px 16px 10px; height: 58px; border: 0; border-radius: 12px;
           background: var(--ink); color: #fff; font-size: 22px; font-weight: 700; }
  body.card #pad { display: none; } body.card #again { display: block; }
  .hint { color: var(--mute); font-size: 15px; line-height: 1.45; }
  .hint b { color: var(--ink); }
  .hdr { margin-bottom: 10px; }
  .hdr .no { font-size: 44px; font-weight: 800; line-height: 1.05; }
  .hdr .nick { font-size: 26px; font-weight: 700; margin-top: 4px; word-break: break-word; }
  .hdr .tbl { font-size: 13px; color: var(--mute); margin-top: 4px; }
  .ban { border-radius: 12px; padding: 10px 12px; font-size: 18px; font-weight: 700; margin: 8px 0; }
  .ban.bad { background: var(--badbg); color: var(--bad); }
  .ban.warn { background: var(--warnbg); color: var(--warn); }
  .ban.info { background: var(--soft); color: var(--ink); font-weight: 600; font-size: 16px; }
  .sec { margin: 16px 0 6px; font-size: 14px; font-weight: 800; letter-spacing: .5px; color: var(--mute); text-transform: uppercase; }
  .sec.ok { color: var(--ok); }
  .it { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .it .ph { flex: 0 0 72px; width: 72px; height: 72px; border-radius: 10px; background: var(--soft) center/cover no-repeat;
            display: flex; align-items: center; justify-content: center; font-size: 11px; color: #aaa; text-align: center; }
  .it .tx { flex: 1; min-width: 0; }
  .it .nm { font-size: 17px; font-weight: 700; word-break: break-word; }
  .it .vr { font-size: 16px; color: var(--ink); margin-top: 2px; word-break: break-word; }
  .chips { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; font-weight: 700; border-radius: 8px; padding: 2px 8px; background: var(--soft); color: var(--ink); }
  .chip.ok { background: var(--okbg); color: var(--ok); } .chip.warn { background: var(--warnbg); color: var(--warn); }
  .chip.bad { background: var(--badbg); color: var(--bad); }
  .it.off { opacity: .55; } .it.off .nm { text-decoration: line-through; }
  .row { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: #fff;
         padding: 12px; margin: 0 0 8px; font: inherit; color: inherit; }
  .row .a { font-size: 24px; font-weight: 800; } .row .b { font-size: 18px; font-weight: 700; margin-top: 2px; word-break: break-word; }
  .row .c { font-size: 13px; color: var(--mute); margin-top: 2px; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; z-index: 50; }
  #zoom img { max-width: 100%; max-height: 100%; }
  #deny { position: fixed; inset: 0; background: #fff; z-index: 60; display: none; align-items: center; justify-content: center;
          padding: 24px; text-align: center; font-size: 19px; font-weight: 600; line-height: 1.5; }
  #info { font-size: 13px; color: var(--mute); white-space: pre-wrap; margin-top: 18px; }
  .sec.other { color: var(--warn); }
  .grp { opacity: .8; }
</style>

<body>

<div id="top">
  <div id="disp"><div id="num" class="ph">№ заказа</div></div>
  <div id="sync">Открываю список…</div>
</div>
<div id="out"></div>
<div id="pad">
  <button type="button" data-d="1">1</button><button type="button" data-d="2">2</button><button type="button" data-d="3">3</button>
  <button type="button" data-d="4">4</button><button type="button" data-d="5">5</button><button type="button" data-d="6">6</button>
  <button type="button" data-d="7">7</button><button type="button" data-d="8">8</button><button type="button" data-d="9">9</button>
  <button type="button" class="del" data-d="del">⌫</button><button type="button" data-d="0">0</button><button type="button" class="go" data-d="go">Найти</button>
</div>
<button id="again" type="button">Новый поиск</button>
<div id="zoom"><img id="zimg" alt=""></div>
<div id="deny"></div>

<script>
(function () {
  'use strict';
  var VER = 'v2 · 26.09.2026';
  // Боевой адрес склада — тот же, что вшит в ярлык склада (warehouse-scanner/sklad/index.html).
  var EXEC = 'https://script.google.com/macros/s/AKfycbz_oNEUewSu_HxqHqLkCHDtLdrQTLw4YXLBxhQYHGvFl2O4WqAwPjyoAn5esdzA4xMSTw/exec';
  var MAXLEN = 6;                 // номер заказа — до 4 цифр, с серией — 5; шестая — запас
  // ⭐ ОСВЕЖЕНИЕ ПО ХОДУ РАБОТЫ [Кодекс, круг 1, HIGH-4]: касса, открытая с утра, иначе весь день искала
  // бы по утреннему списку. Пока кассир работает (нажимал кнопки последние 10 мин) и экран виден —
  // освежаем, если последнему освежению больше 2 мин. Цена — 1 + N коротких вызовов; ответ чаще всего
  // «та же», лист закупки читает только сборка на сервере, не чаще раза в 5 мин на закупку.
  var SYNC_EVERY = 120000, ACTIVE_FOR = 600000;
  // ⚠️ Старые закупки освежаются ВМЕСТЕ со свежей [Кодекс, круг 2, CRIT-1 и MED-5]: сверенным считается
  // только поиск по ВСЕМ спискам — чужой номер может сидеть в любой закупке. Цена: сервер собирает выжимку
  // закупки не чаще раза в 5 мин (≤12 чтений в час на документ), остальное — ответы «та же».
  // ⛔️ САМА КАРТОЧКА ОТКРЫВАЕТСЯ ТОЛЬКО ПО СВЕРЕННОМУ ПОИСКУ [Фейбл HIGH-1 обеих линз, круг 1; Кодекс CRIT-1,
  // круг 2]: не раньше 5 мин назад сверены И список закупок (не появилась ли новая), И выжимки ВСЕХ закупок
  // (выжимка на сервере сама живёт 5 мин — свежее не бывает). Свежесть одной найденной ничего не говорит о
  // соседней, где мог появиться второй такой номер. Первый поиск
  // после простоя идёт по памяти телефона, где свежего заказа 9-905 ещё нет, — и «905» сама открыла бы
  // 8-905 чужой клиентки из прошлой закупки. Несверенное — строкой списка с «сверяю…»; сверилось — карточка
  // открывается сама. Пока кассир работает, освежение каждые 2 мин держит список сверенным — ждать не приходится.
  var VERIFIED_FOR = 300000;
  // ⏱ СКОЛЬКО ЖДАТЬ GOOGLE [живая проверка владельца 26.09.2026]: в тот день Google держал ЛЮБОЙ запрос к складу
  // 10–114 с (сам склад отвечал за 0,1–2 с — журнал), и при прежних 45 с большая закупка не грузилась НИКОГДА:
  // ответ приходил на 50-й секунде, а касса его уже выбросила. Ждать дольше ничего не стоит — поиск по уже
  // загруженному идёт из памяти телефона, пока запрос летит.
  var WAIT_TABLES = 90000, WAIT_PACK = 150000;
  var $ = function (id) { return document.getElementById(id); };

  // ── ключ телефона: из ярлыка (#k=…), иначе из памяти этой страницы ─────────────────────
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
  var KEY = (function () {
    var m = String(location.hash || '').match(/[#&]k=([^&]*)/);
    var h = '';
    try { h = m ? decodeURIComponent(m[1]) : ''; } catch (e) { h = ''; }
    h = h.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
    if (h) { lsSet('kassa_k', h); return h; }
    return lsGet('kassa_k');
  })();

  // ── память телефона (IndexedDB): список закупок и выжимки ─────────────────────────────
  var DB = null;
  function withTimeout(pr, ms) {
    return Promise.race([pr, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); })]);
  }
  function idbOpen() {
    return withTimeout(new Promise(function (res, rej) {
      var r = indexedDB.open('kassa', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
      r.onblocked = function () { rej(new Error('blocked')); };
    }), 5000);
  }
  function idbGet(k) {
    if (!DB) return Promise.resolve(null);
    return withTimeout(new Promise(function (res, rej) {
      var q = DB.transaction('kv', 'readonly').objectStore('kv').get(k);
      q.onsuccess = function () { res(q.result == null ? null : q.result); };
      q.onerror = function () { rej(q.error); };
    }), 5000).catch(function () { return null; });
  }
  function idbPut(k, v) {
    if (!DB || DENIED) return Promise.resolve();
    return withTimeout(new Promise(function (res, rej) {
      var tx = DB.transaction('kv', 'readwrite');
      if (v === undefined) tx.objectStore('kv').delete(k); else tx.objectStore('kv').put(v, k);
      tx.oncomplete = function () { res(); };
      tx.onerror = tx.onabort = function () { rej(tx.error); };
    }), 10000).catch(function () {});
  }

  // ── состояние ─────────────────────────────────────────────────────────────────────────
  var TABLES = null;          // { at, list: [{id, name}] }
  var PACKS = {};             // srcId → { id, t, p (разобранная выжимка), checked }
  var syncing = false, lastSyncAt = 0, lastNet = '';   // lastNet: '' | 'нет связи' | 'не пускают'
  var typed = '', pendingSearch = '', lastActivity = Date.now();
  var CUR = null;             // что на экране: { kind: 'card'|'list'|'nf', digits, sel?, sig, fromList? }
  var DENIED = false;

  function isEfirName(n) { return /эфир|efir/i.test(String(n || '')); }
  function hhmm(t) {
    if (!t) return '—';
    var d = new Date(t), p = function (x) { return (x < 10 ? '0' : '') + x; };
    var s = p(d.getHours()) + ':' + p(d.getMinutes());
    if (d.toDateString() !== new Date().toDateString()) s = p(d.getDate()) + '.' + p(d.getMonth() + 1) + ' ' + s;
    return s;
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = String(text);
    return e;
  }

  // ── JSONP к складу (как у сканера): <script src="…&callback=…"> ────────────────────────
  var jp = 0;
  function jsonp(action, params, timeoutMs) {
    return new Promise(function (resolve) {
      var cb = 'kcb' + (++jp) + '_' + Date.now().toString(36);
      var s = document.createElement('script'), done = false;
      var timer = setTimeout(function () { finish(null); }, timeoutMs || WAIT_TABLES);
      function finish(d) {
        if (done) return; done = true;
        clearTimeout(timer);
        window[cb] = function () {};                       // поздний ответ после таймаута — молча
        if (s.parentNode) s.parentNode.removeChild(s);
        if (d && d.error === 'no_key') denied();
        resolve(d || null);
      }
      window[cb] = function (d) { finish(d); };
      s.onerror = function () { finish(null); };
      var qs = 'action=' + action + '&callback=' + cb;
      for (var k in params) if (params[k] !== '' && params[k] != null) qs += '&' + k + '=' + encodeURIComponent(params[k]);
      if (KEY) qs += '&k=' + encodeURIComponent(KEY);
      s.src = EXEC + '?' + qs;
      document.head.appendChild(s);
    });
  }
  // ⛔️ ОТКАЗ ПО КЛЮЧУ — СТИРАЕМ СПИСОК КЛИЕНТОВ ИЗ ТЕЛЕФОНА [Кодекс HIGH-6, Фейбл MED-1, круг 1].
  // Иначе отозванный телефон в авиарежиме открывал бы сохранённый список как ни в чём не бывало.
  // Отказ помним по ключу: тот же ключ при следующем запуске сразу видит экран отказа и данных не
  // читает, но склад всё равно спрашиваем — пустил (защиту выключили) → работаем дальше. Уже летящие
  // ответы после отказа в память не пишутся (DENIED). Остаток честный: телефон, который вообще не
  // выходит в сеть, про отзыв не узнает — как и любой офлайн-список.
  function showDeny() {
    var d = $('deny');
    d.textContent = 'Этот телефон не пускают в кассу.\n\nПопросите у владельца ссылку «Касса» для этого телефона ' +
                    '(в таблице: меню → «🧾 Ссылка «Касса» для телефона»).';
    d.style.whiteSpace = 'pre-line';
    d.style.display = 'flex';
  }
  function denied() {
    DENIED = true; lastNet = 'не пускают';
    lsSet('kassa_denied', KEY || '-');
    lsSet('kassa_k', '');
    PACKS = {}; TABLES = null;
    try { if (DB) DB.close(); } catch (e) {}
    DB = null;
    try { indexedDB.deleteDatabase('kassa'); } catch (e) {}
    showDeny();
  }

  // ── фоновое освежение списка ──────────────────────────────────────────────────────────
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function syncPack(t, attempt) {
    var cur = PACKS[t.id];
    var r = await jsonp('kassa_pack', { src: t.id, have: cur ? cur.id : '', ph: isEfirName(t.name) ? '' : '1' }, WAIT_PACK);
    if (DENIED) return false;
    if (!r) return null;
    if (r.ok && r.same && cur) { cur.checked = Date.now(); return false; }
    if (r.ok && typeof r.pack === 'string') {
      var p = null;
      try { p = JSON.parse(r.pack); } catch (e) { p = null; }
      if (!p || p.v !== 1 || !p.c || !p.n) return false;
      if (!TABLES || !TABLES.list.some(function (x) { return x.id === t.id; })) return false;   // закупка ушла из списка, пока ждали
      PACKS[t.id] = { id: String(r.id || ''), t: Number(r.t) || Number(p.t) || 0, p: p, checked: Date.now() };
      // ⛔️ Экран — СРАЗУ, не дожидаясь соседних закупок [Кодекс, круг 2, CRIT-3]: молчание одной закупки
      // держало бы на экране прежнего клиента до 45 с, хотя телефон уже знает нового.
      refreshView();
      await idbPut('pack_' + t.id, { id: String(r.id || ''), t: Number(r.t) || Number(p.t) || 0, json: r.pack });
      return true;
    }
    // «строится» — другой телефон уже строит; подождём и спросим ещё (недолго). Тормоза/болезнь
    // документа — держим прежний список, спросим при следующем освежении.
    if (r.building && (attempt || 0) < 4) { await sleep(5000); return syncPack(t, (attempt || 0) + 1); }
    // «болен» / «медленно» / отказ — список НЕ сверен: отметку сверки не ставим (иначе старый список
    // выглядел бы сверенным и открывал бы карточку сам).
    return false;
  }
  async function sync() {
    if (syncing || DENIED) return;
    syncing = true; lastNet = ''; renderSync();
    var changed = false, answered = 0;
    var done = {};
    var runPack = function (t) { done[t.id] = 1; return syncPack(t, 0).then(function (r) { if (r) changed = true; if (r !== null) answered++; }); };
    try {
      // Выжимки знакомых закупок спрашиваем сразу, не дожидаясь списка: он бывает долгим, а свежий заказ нужен сейчас.
      var known = TABLES ? TABLES.list.slice() : [];
      var packsNow = Promise.all(known.map(runPack));
      var tr = await jsonp('kassa_tables', {}, WAIT_TABLES);
      if (DENIED) return;
      if (tr) answered++;
      if (tr && tr.ok && tr.complete && tr.list && tr.list.length) {
        var ids = tr.list.map(function (t) { return t.id; });
        var old = TABLES ? TABLES.list.map(function (t) { return t.id; }).join(',') : '';
        TABLES = { at: tr.at, list: tr.list, checked: Date.now() };
        await idbPut('tables', { at: tr.at, list: tr.list });
        if (ids.join(',') !== old) {                         // закупка ушла из списка — её выжимку не храним
          changed = true;
          for (var src in PACKS) if (ids.indexOf(src) < 0) { delete PACKS[src]; await idbPut('pack_' + src, undefined); }
          refreshView();
        }
      }
      var added = TABLES ? TABLES.list.filter(function (t) { return !done[t.id]; }) : [];
      await Promise.all([packsNow, Promise.all(added.map(runPack))]);
      if (!answered) lastNet = 'нет связи';
    } catch (e) {
      lastNet = lastNet || 'сбой';
    } finally {
      syncing = false; lastSyncAt = Date.now(); renderSync();
      if (!DENIED) {
        if (pendingSearch && pendingSearch === typed && (!CUR || CUR.kind !== 'card')) { var q = pendingSearch; pendingSearch = ''; search(q, true); }
        else if (changed || (CUR && (CUR.checking || CUR.kind === 'list'))) refreshView();
      }
    }
  }

  function missingTables() {
    if (!TABLES) return [];
    return TABLES.list.filter(function (t) { return !PACKS[t.id]; });
  }
  function oldestT() {
    var t = 0;
    if (!TABLES) return 0;
    TABLES.list.forEach(function (x) { var pk = PACKS[x.id]; if (pk && pk.t && (!t || pk.t < t)) t = pk.t; });
    return t;
  }
  function renderSync() {
    var s = $('sync'), n = 0, have = 0;
    if (TABLES) TABLES.list.forEach(function (x) { var pk = PACKS[x.id]; if (pk) { have++; n += pk.p.c.length; } });
    var txt, cls = '';
    if (!TABLES || !have) {

      lines.push('• ' + t.name + ': ' + (pk ? ('клиентов ' + pk.p.c.length + ', данные на ' + hhmm(pk.t)) : 'списка нет'));
    });
    if (!KEY) lines.push('Ключ телефона не найден — откройте ссылку «Касса» из таблицы.');
    var d = el('div', null, lines.join('\n')); d.id = 'info';
    o.appendChild(d);
  }

  // ── клавиатура ───────────────────────────────────────────────────────────────────────
  $('pad').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    lastActivity = Date.now();
    var d = b.getAttribute('data-d');
    if (d === 'go') { pendingSearch = ''; if (typed) search(typed, false); return; }
    // ⛔️ Правка номера гасит прежний поиск [Кодекс, круг 2, CRIT-2]: иначе освежение, пришедшее между
    // правкой и «Найти», пересобирало бы экран по СТАРЫМ цифрам и само открывало бы чужую карточку.
    if (d === 'del') typed = typed.slice(0, -1);
    else if (typed.length < MAXLEN) typed += d;
    else return;
    pendingSearch = '';
    renderNum();
    if (CUR) showHome();
  });
  var cardAt = 0;
  $('again').onclick = function () {
    if (Date.now() - cardAt < 400) return;             // двойной тап по «Найти» не закрывает карточку сразу
    lastActivity = Date.now(); typed = ''; pendingSearch = ''; renderNum(); showHome();
  };
  $('zoom').onclick = function () { $('zoom').style.display = 'none'; $('zimg').removeAttribute('src'); };
  $('sync').onclick = function () { lastActivity = Date.now(); sync(); };
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { lastActivity = Date.now(); if (Date.now() - lastSyncAt > 60000) sync(); }
  });
  setInterval(function () {
    if (DENIED) return;
    renderSync();
    if (document.visibilityState === 'visible' && Date.now() - lastActivity < ACTIVE_FOR && Date.now() - lastSyncAt > SYNC_EVERY) sync();
  }, 30000);

  // ── старт: сначала всё из памяти телефона, потом фоном — Google ─────────────────────────
  (async function boot() {
    renderNum(); showHome();
    var dk = lsGet('kassa_denied');
    if (dk && dk === (KEY || '-')) {
      // Этот ключ склад уже не пускал: данных не читаем, но спрашиваем склад ещё раз.
      DENIED = true; showDeny();
      var r = await (function () { DENIED = false; return jsonp('kassa_tables', {}, WAIT_TABLES); })();
      if (!r || !r.ok) { DENIED = true; showDeny(); return; }
      lsSet('kassa_denied', ''); $('deny').style.display = 'none';
    }
    try {
      DB = await idbOpen();
      var tb = await idbGet('tables');
      if (tb && tb.list && tb.list.length) {
        TABLES = { at: tb.at, list: tb.list, checked: 0 };     // из памяти — не сверен в этом сеансе
        for (var i = 0; i < tb.list.length; i++) {
          var rec = await idbGet('pack_' + tb.list[i].id);
          if (rec && typeof rec.json === 'string') {
            try { var p = JSON.parse(rec.json); if (p && p.v === 1 && p.c && p.n) PACKS[tb.list[i].id] = { id: rec.id, t: rec.t, p: p, checked: 0 }; } catch (e) {}
          }
        }
      }
    } catch (e) { DB = null; }
    if (DENIED) return;
    renderSync(); showHome();
    sync();
  })();

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  // Новая версия страницы: сторож тянет её в фоне; при возврате в кассу просим проверить обновление.
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(function (reg) {
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { try { reg.update(); } catch (e) {} } });
  }).catch(function () {});
})();
</script>
</body>
</html>
