<!-- 🧾 «КАССА» — СТРАНИЦА ВЫДАЧИ ЗАКАЗА (25.09.2026; вид B и выдача — 26.09.2026)
     [владелец: «кассиру нужен только поиск и выдача» — клиент не должен ждать у кассы, пока грузится аппка]
     Страница и список заказов лежат В ТЕЛЕФОНЕ/КОМПЬЮТЕРЕ (сторож sw.js + IndexedDB): иконка открывается за доли
     секунды, поиск идёт по списку без Google. Google спрашиваем ФОНОМ — освежить список (двери kassa_tables /
     kassa_pack склада, apps-script/kassa.js) — и на нажатие кнопок выдачи (kassa_give / kassa_unnet).
     Вход — по ключу телефона после решётки (#k=…), тот же ключ, что у ярлыка склада: отзыв телефона
     закрывает и кассу. Ключ после «#» браузер не отправляет на GitHub.
     ⭐ ВИД B [владелец 26.09.2026: «90% на компе (у нас на кассе стоит комп)… приблизь к дизайну Собрать заказ,
     только всё бОльшего размера на компе»; «вариант 2… чтобы в экран влезло минимум 6, а лучше 9 вещей»]:
     на экране шире 900 px — слева поиск, заказ, сумма и две кнопки (всегда на месте), справа вещи плитками 3×3
     (больше 9 — прокручивается только правая часть). Уже 900 px — одна колонка, как было, с кнопками-цифрами.
     ⛔️ Слова «пакет» на экране НЕТ [владелец: «Всегда речь только о „заказе“»].
     ⭐ ВЫБОР ЗАКУПКИ ВВЕРХУ [владелец 27.09.2026: «показывай вверху наш выбор закупочной таблицы (дроп-даун, последние
     3 закупки (в тч Эфир и Скидки)), но по умолчанию показывай и ищи ТОЛЬКО в самой свежей. Во всех таблицах искать не
     надо»]: касса грузит, сверяет и ищет только выбранную закупку; при каждом открытии выбрана самая свежая.
     ⛔️ Данные клиентов в разметку попадают ТОЛЬКО через textContent — никакого innerHTML с данными. -->

<style>
  :root { --ink: #18202c; --mute: #6b7280; --line: #e3e7ee; --bg: #f4f6f9; --card: #ffffff; --soft: #f3f4f6;
          --ok: #0b8043; --okbg: #e9f7ef; --okline: #d3ebdc; --oktx: #4a735b;
          --warn: #9a5b00; --warnbg: #fff4e0; --warnline: #e8a33d; --bad: #b00020; --badbg: #fde6e9;
          --blue: #1a73e8; --bluebg: #eef3fe;
          --caret: #9aa3b2; }   /* мигающий курсор поля — светло-серый, как подсказка [владелец 30.09.2026, v6.11] */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100%;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); overflow: hidden; }
  button { font: inherit; }
  #top { flex: none; background: var(--card); padding: 10px 16px 6px; border-bottom: 1px solid var(--line); }
  #tblbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  #tblbar .l { flex: none; color: var(--mute); font-size: 15px; font-weight: 700; }
  #tbl { flex: 1; min-width: 0; height: 40px; font: inherit; font-size: 17px; font-weight: 800; color: var(--ink); padding: 0 8px;
         border: 2px solid var(--line); border-radius: 10px; background: var(--card); cursor: pointer; }
  /* Выбрана не последняя закупка — видно издалека, чтобы не забыть вернуть [владелец: «по умолчанию — самая свежая»] */
  #tblbar.old #tbl { border-color: var(--warnline); background: var(--warnbg); color: var(--warn); }
  /* ⏳ Очередь записей (v6.6): выдачи, которые склад ещё не подтвердил, — видно на любом экране. Не подтверждает дольше 10 мин —
     красным [владелец 29.09.2026: «сохранять заказ на фоне, чтобы работник мог дальше работать»]. */
  #wq { flex: none; font-size: 14px; font-weight: 800; border-radius: 10px; padding: 6px 10px; background: var(--warnbg); color: var(--warn);
        white-space: nowrap; }
  #wq.bad { background: var(--badbg); color: var(--bad); }
  #wq[hidden] { display: none; }
  #wq { cursor: pointer; }
  /* Удачная фоновая запись прошлого клиента — тихой строкой, без суммы (не путать с деньгами текущего) [v6.6] */
  .wqok { color: var(--oktx); font-size: 14px; font-weight: 700; margin: 8px 0 0; }
  #disp { display: flex; align-items: center; gap: 8px; position: relative; }
  /* Мигающий курсор на телефоне [владелец 28.09.2026: «Если ставлю курсор в поле поиска — курсор должен там мигать»]: поле
     там только показывает набранное кнопками-цифрами (своя клавиатура, системная не выезжает), и родного курсора у него нет —
     рисуем свой за последней цифрой, пока цифры на экране. */
  #caret { position: absolute; display: none; width: 3px; border-radius: 2px; background: var(--caret); pointer-events: none;
           animation: caretblink 1s step-end infinite; }
  @keyframes caretblink { 50% { opacity: 0; } }
  #num { flex: 1; min-width: 0; width: 100%; font: inherit; font-size: 32px; font-weight: 800; letter-spacing: .5px;
         height: 56px; padding: 0 14px; border: 3px solid var(--blue); background: var(--bluebg); border-radius: 14px;
         color: var(--ink); caret-color: var(--caret); outline: none; }
  #num::placeholder { color: #9aa3b2; font-weight: 600; font-size: 20px; letter-spacing: 0; }
  #abc { flex: none; height: 56px; min-width: 60px; border: 0; border-radius: 14px; background: var(--soft);
         font-size: 20px; font-weight: 800; color: var(--ink); cursor: pointer; }
  #abc.on { background: var(--blue); color: #fff; }
  #find { display: none; }
  #sync { margin-top: 6px; font-size: 13px; color: var(--mute); min-height: 18px; cursor: pointer; }
  #sync.bad { color: var(--bad); } #sync.warn { color: var(--warn); }
  #main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #head { padding: 12px 16px 0; }
  #head:empty { display: none; }
  #out { padding: 8px 16px 16px; }
  #acts { flex: none; display: none; gap: 8px; padding: 8px 16px 10px; background: #fafafa; border-top: 1px solid var(--line); }
  body.card #acts { display: grid; grid-template-columns: 1fr 1fr; }
  .btn { border: 0; border-radius: 14px; font-weight: 800; cursor: pointer; height: 58px; font-size: 19px; padding: 0 10px; }
  .btn:disabled { opacity: .38; cursor: default; }
  #giveAll { background: var(--ok); color: #fff; }
  #givePart { background: #fff; color: #b3700f; border: 3px solid var(--warnline); }
  #pad { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 16px 10px;
         border-top: 1px solid var(--line); background: #fafafa; }
  #pad button { font-size: 28px; font-weight: 700; height: 56px; border: 0; border-radius: 12px;
                background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  #pad button:active { background: #eaeaea; }
  #pad .go { background: var(--ink); color: #fff; font-size: 22px; }
  #pad .del { font-size: 24px; color: var(--mute); }
  /* Кнопки «Новый поиск» нет [владелец 28.09.2026: «кнопка Новый поиск не нужна. Вверху есть же поле поиска»]: на карточке
     поле пустое, тап по нему — снова цифры (numEl, click). */
  body.card #pad { display: none; }
  .hint { color: var(--mute); font-size: 16px; line-height: 1.5; }
  .hint b { color: var(--ink); }
  .hdr .lbl { color: #8a919c; font-size: 15px; font-weight: 700; }
  .hdr .no { font-size: 42px; font-weight: 900; color: var(--blue); line-height: 1.05; word-break: break-word; }
  .hdr .nick { font-size: 26px; font-weight: 800; margin-top: 4px; word-break: break-word; }
  .hdr .tbl { color: #8a919c; font-size: 14px; font-weight: 600; margin-top: 4px; }
  .sumb { background: var(--okbg); border: 1px solid var(--okline); border-radius: 16px; padding: 10px 16px; margin-top: 12px; }
  .sumb .l { color: var(--oktx); font-size: 17px; font-weight: 700; }
  .sumb .r { color: var(--ok); font-size: 42px; font-weight: 900; line-height: 1.1; }
  .sumb .iv { color: var(--oktx); font-size: 15px; font-weight: 600; margin-top: 4px; }
  .sumb .np { color: var(--warn); font-size: 15px; font-weight: 700; margin-top: 4px; }
  .note { background: var(--soft); border-radius: 12px; padding: 8px 12px; color: var(--mute); font-size: 15px; font-weight: 600; margin-top: 10px; }
  .ban { border-radius: 12px; padding: 10px 12px; font-size: 17px; font-weight: 700; margin: 10px 0 0; line-height: 1.35; }
  .ban.bad { background: var(--badbg); color: var(--bad); }
  .ban.warn { background: var(--warnbg); color: var(--warn); }
  .ban.info { background: var(--soft); color: var(--ink); font-weight: 600; font-size: 16px; }
  .ban.ok { background: var(--okbg); color: var(--ok); }
  /* «Сверяю…» — не полоса, а тихая строка [владелец 28.09.2026: «не надо жёлтым, а светло-серым маленьким шрифтом, без фоновой
     подложки, и пусть просто мигает»]. «Не сверен» (сверка не удалась) — по-прежнему жёлтой полосой: это уже предупреждение. */
  .chk { color: #9aa3b2; font-size: 13px; font-weight: 600; margin: 8px 0 0; animation: chkblink 1.4s ease-in-out infinite; }
  /* «обновляю…» в строке состояния и «Обновляю список и ищу ещё раз…» — так же мигают [владелец 28.09.2026: «обновляю
     должно мигать»]. */
  .blink { animation: chkblink 1.4s infinite ease-in-out; }
  @keyframes chkblink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .chk, .blink { animation: none; } }
  .ban .x { float: right; border: 0; background: transparent; color: inherit; font: inherit; font-size: 24px; line-height: 1;
            padding: 0 4px; margin: -2px -4px 0 10px; cursor: pointer; }
  .sec { margin: 18px 0 8px; font-size: 15px; font-weight: 800; letter-spacing: .3px; color: var(--mute); }
  .sec:first-child { margin-top: 4px; }
  .sec.ok { color: var(--ok); font-size: 19px; }
  .sec.w { color: var(--warn); }
  .sec.other { color: var(--warn); }
  .sec small { font-weight: 600; font-size: 14px; color: var(--mute); margin-left: 8px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .it { display: flex; gap: 12px; align-items: stretch; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px; }
  .it .ph { flex: 0 0 72px; width: 72px; height: 96px; border-radius: 8px; background: var(--soft) center/cover no-repeat;
            display: flex; align-items: center; justify-content: center; font-size: 11px; color: #aaa; text-align: center; }
  .it .ph.z { cursor: zoom-in; }
  .it .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .it .nm { font-size: 17px; font-weight: 800; line-height: 1.2; word-break: break-word;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .it .vr { font-size: 15px; color: #777; margin-top: 4px; word-break: break-word; }
  .it .vr b { color: #333; }
  .it .inv { font-size: 14px; font-weight: 800; color: var(--ok); margin-top: 4px; word-break: break-word; }
  .it .pr { font-size: 20px; font-weight: 900; color: var(--ok); margin-top: auto; padding-top: 4px; }
  .it .pr.np { color: var(--warn); font-size: 16px; }
  .it.st-n { background: var(--okbg); border-color: var(--ok); }
  .it.st-w { background: var(--warnbg); border-color: var(--warnline); }
  .it.st-g { background: #f1f3f4; border-color: #d6dbe3; }
  .it.st-g .pr { color: var(--mute); }
  .it.off { opacity: .55; } .it.off .nm { text-decoration: line-through; }
  .sw { display: inline-block; padding: 0 8px; border-radius: 7px; font-weight: 800; border: 2px solid transparent; line-height: 1.35; }
  .chips { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; font-weight: 700; border-radius: 8px; padding: 2px 8px; background: var(--soft); color: var(--ink); }
  .chip.ok { background: var(--okbg); color: var(--ok); } .chip.warn { background: var(--warnbg); color: var(--warn); }
  .chip.bad { background: var(--badbg); color: var(--bad); }
  .un { margin-top: 6px; border: 0; border-radius: 10px; background: #b3700f; color: #fff; font-weight: 800; padding: 8px 10px;
        font-size: 15px; cursor: pointer; align-self: flex-start; }
  .un:disabled { opacity: .45; cursor: default; }
  .sw2 { margin: 6px 0 0; border: 2px solid var(--warnline); border-radius: 10px; background: #fff; color: #b3700f; font-weight: 800;
         padding: 6px 12px; font-size: 15px; cursor: pointer; }
  .row { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: #fff;
         padding: 12px; margin: 0 0 8px; font: inherit; color: inherit; cursor: pointer; }
  .row .a { font-size: 24px; font-weight: 800; } .row .b { font-size: 18px; font-weight: 700; margin-top: 2px; word-break: break-word; }
  .row .c { font-size: 13px; color: var(--mute); margin-top: 2px; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; z-index: 50; }
  #zoom img { max-width: 100%; max-height: 100%; }
  #deny { position: fixed; inset: 0; background: #fff; z-index: 60; display: none; align-items: center; justify-content: center;
          padding: 24px; text-align: center; font-size: 19px; font-weight: 600; line-height: 1.5; }
  #info { font-size: 13px; color: var(--mute); white-space: pre-wrap; margin-top: 18px; }
  .grp { opacity: .8; }
  /* ⭐ РАМКИ ЗАКАЗОВ [владелец 28.09.2026, вариант A: «надо отделить заказы друг от друга»]: выбранный заказ (его выдают
     кнопки) — зелёной рамкой, остальные — серыми с «Открыть этот заказ»; жёлтая «нет» и отмены — внутри своего заказа. */
  .ord { background: #fff; border: 3px solid #d6dbe3; border-radius: 18px; margin: 18px 0 0; overflow: hidden; }
  .ord:first-child { margin-top: 4px; }
  .ord .oh { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; padding: 10px 14px; background: #eef1f5; }
  .ord .oh .on { font-size: 23px; font-weight: 900; }
  .ord .oh .oc { font-size: 16px; font-weight: 700; color: var(--mute); }
  .ord .oh .sw3 { margin-left: auto; border: 2px solid var(--warnline); border-radius: 10px; background: #fff; color: #b3700f;
                  font-weight: 800; padding: 6px 12px; font-size: 15px; cursor: pointer; }
  .ord .ob { padding: 10px 10px 12px; }
  .ord.cur { border-color: var(--ok); }
  .ord.cur .oh { background: var(--ok); color: #fff; } .ord.cur .oh .oc { color: #d4f0de; }
  .ord:not(.cur) .it { opacity: .85; }
  .osub { margin: 14px 2px 8px; font-size: 15px; font-weight: 800; color: var(--mute); }
  .osub:first-child { margin-top: 2px; }
  .osub.w { color: var(--warn); } .osub.c { color: var(--bad); }
  /* Окно «Какие вещи забрала?» и «Снять «нет»?» */
  #dlg { position: fixed; inset: 0; background: rgba(17,24,39,.55); display: none; align-items: center; justify-content: center;
         z-index: 40; padding: 10px; }
  #dlg.on { display: flex; }
  .dlgbox { background: #fff; border-radius: 18px; width: min(1180px, 100%); max-height: 100%; padding: 16px 18px;
            display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .dlgbox h3 { margin: 0; font-size: 24px; font-weight: 900; }
  .dlgbox .sub { color: var(--mute); font-size: 15px; font-weight: 600; line-height: 1.4; }
  .dlgbox .lst { overflow-y: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-height: 0; }
  .ck { display: flex; align-items: center; gap: 10px; border: 3px solid #d6dbe3; border-radius: 14px; padding: 6px 10px;
        background: #fff; cursor: pointer; text-align: left; width: 100%; color: inherit; }
  .ck.on { border-color: var(--ok); background: var(--okbg); }
  .ck .bx { width: 40px; height: 40px; border-radius: 10px; border: 3px solid #9aa0a8; flex: none; display: flex;
            align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: #fff; }
  .ck.on .bx { background: var(--ok); border-color: var(--ok); }
  .ck .cph { width: 48px; height: 64px; border-radius: 8px; flex: none; background: var(--soft) center/cover no-repeat; }
  .ck .t { font-size: 17px; font-weight: 800; line-height: 1.2; min-width: 0; word-break: break-word; }
  .ck .t small { display: block; color: var(--mute); font-size: 14px; font-weight: 600; margin-top: 3px; }
  .ck .p { margin-left: auto; font-size: 19px; font-weight: 900; color: var(--ok); white-space: nowrap; padding-left: 8px; }
  .dlgft { display: flex; align-items: center; gap: 12px; border-top: 2px solid #eef0f4; padding-top: 12px; flex-wrap: wrap; }
  .dlgft .s { font-size: 16px; color: var(--oktx); font-weight: 700; margin-right: auto; }
  .dlgft .s b { display: block; font-size: 30px; color: var(--ok); }
  .dlgft .btn { height: 62px; padding: 0 22px; font-size: 21px; }
  .dlgft .ok { background: var(--ok); color: #fff; } .dlgft .no { background: #fff; color: var(--mute); border: 3px solid #d6dbe3; }
  .dlgft .okw { background: #b3700f; color: #fff; }
  /* Окно «Заказ не отмечен» (п.3 v6.7): три кнопки справа; на телефоне — одна под другой во всю ширину */
  .dlgft.lv { justify-content: flex-end; }
  .dlgft .lvpart { background: #fff; color: #b3700f; border: 3px solid var(--warnline); }

  /* ── ШАПКА BERKONTI НА ПУСТОМ ЭКРАНЕ [владелец 27.09.2026: «поставь в верхнюю часть лого беркоти и допиши там ниже
     BERKONTI выдача заказов»; «Выбираю вариант Б — блик, только процентов на 15 уменьши лого»]: знак крупно, под ним
     BERKONTI и «выдача заказов»; по логотипу раз в 7 с проходит мягкий блик. Логотип — logo.png (тот же, что на экране
     загрузки склада), знак и надпись вырезаны из него маской; «краска» под маской и двигается. Только CSS — на скорость
     кассы не влияет; «Уменьшение движения» на телефоне — стоит спокойно. Видна только на пустом экране (главный, «не
     найден»): список и карточка — во весь экран, как были. */
  #brand { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px 16px;
           pointer-events: none; }
  body.brand #brand { display: flex; }
  #brand .mk { --h: 82px; height: var(--h); width: calc(var(--h) * 202 / 162);
               -webkit-mask: url("logo.png") 0 0 / auto 100% no-repeat; mask: url("logo.png") 0 0 / auto 100% no-repeat; }
  #brand .wm { --h: 18px; height: var(--h); width: calc(var(--h) * 922 / 67);
               -webkit-mask: url("logo.png") calc(var(--h) * -256 / 67) calc(var(--h) * -52 / 67) / calc(var(--h) * 1178 / 67) calc(var(--h) * 162 / 67) no-repeat;
               mask: url("logo.png") calc(var(--h) * -256 / 67) calc(var(--h) * -52 / 67) / calc(var(--h) * 1178 / 67) calc(var(--h) * 162 / 67) no-repeat; }
  #brand .tx { margin-top: -3px; font-size: 13px; font-weight: 600; letter-spacing: .34em; padding-left: .34em; text-transform: uppercase;
               color: #4b5563; }

  // Итог записи виден сразу: вещи помечаем выданными в памяти кассы так же, как их покажет свежая выжимка (буква

  function applyGiven(m, rows) {
    var c = m.c, st = String(c[3] || '').split('');
    rows.forEach(function (r) {
      st[r.k] = String(st[r.k] || 'n').toUpperCase();
      var it = c[2][r.k];
      if (Array.isArray(it)) it[3] = 'd:zabrala';
    });
    c[3] = st.join('');
  }
  function applyUnnet(m, r, no, flag) {
    var c = m.c, st = String(c[3] || '').split('');
    st[r.k] = 'n';
    c[3] = st.join('');
    // Отметка вещи после записи — от склада: пометка «Dz70», которая у жёлтой строку не закрывала, у номера закрывает
    // [Фейбл «корректность», MED-2]; без этого следующее «Забрала всё» получало бы «заказ изменился».
    if (typeof flag === 'string' && Array.isArray(c[2][r.k])) c[2][r.k][3] = flag;
    // Свой номер вещи — как его положит выжимка: только если он не номер клиента.
    if (!c[4] || typeof c[4] !== 'object') c[4] = {};

    // Кол. D у вещи с номером выжимка не везёт (x.d — только у жёлтой и отмены): без этого следующая выжимка отличалась бы
    // подписью (x.d в ней с v6.3) — ложное «данные обновились» и закрытое окно «Какие вещи забрала?» [Кодекс, круг 2 v6.3, MED].
    if (c[6] && typeof c[6] === 'object' && c[6].d && typeof c[6].d === 'object') delete c[6].d[r.k];
    // Ярлык «сняли «нет»» — сразу, как его положит свежая выжимка (x.u), а не через её пересборку.
    if (!c[6] || typeof c[6] !== 'object') c[6] = {};

  }
  // Тот же ли экран после ответа склада: клиент, закупка и запрос (объект выжимки мог смениться свежим — это тот же экран).
  function cardTok() { return CUR && CUR.kind === 'card' ? CUR.sel.tid + '|' + CUR.sel.nick + '|' + CUR.qk : ''; }
  function afterWrite(no, flash) {
    if (!CUR || CUR.kind !== 'card') return;
    refreshSwap = true;                          // экран меняет не кассир — пауза кнопок, если сменился заказ (showCard)
    try { showCard(CUR.h, CUR.q, null, CUR.fromList, no, flash, CUR.who); } finally { refreshSwap = false; }
  }
  function tooFresh() { return !!(CUR && CUR.shownAt && Date.now() - CUR.shownAt < 700); }
  // Идёт сверка открытой карточки — кнопки выдачи на паузе, но не дольше CHECK_HOLD с её показа [владелец 28.09.2026].
  var CHECK_HOLD = 5000;
  function checkHold() { return !!(CUR && CUR.kind === 'card' && CUR.checking && CUR.chkUntil && Date.now() < CUR.chkUntil); }
  // Конец паузы — кнопки снова живые (если карточка та же).
  function pauseLater(at) { setTimeout(function () { if (CUR && CUR.kind === 'card' && CUR.shownAt === at) renderActs(CUR.model); }, 720); }
  // ⏳ ВЫДАЧА НА ФОНЕ (v6.6): нажатие не ждёт склад — вещи выданы на экране сразу, запрос — в очередь записей (см. «ОЧЕРЕДЬ ЗАПИСЕЙ»).
  // Экран «после выдачи» — сразу, деньги — по карточке (как окно «Не забрала всё…»); ответ склада заменит их своими.
  // У клиента в очереди «снять «нет»» — выдача уходит следом за ним (порядок клиента, wqPick) и несёт вещь уже в заказе; отметку вещи,
  // которую склад поставит при снятии, выдаче в очереди поправит unnetPatch [v6.7; до v6.7 выдача ждала словами «через несколько секунд»].
  // force — нажато из окна «Заказ не отмечен» (п.3 v6.7): кассир уже набрал следующий номер (draftOn), а окно названо этим заказом —
  // его и выдаём; пауза 0,7 с после показа карточки не нужна (у окна своя, 0,5 с). Паузы сверки и счёта (≤ 5 с) — и тут в силе.
  // true — выдача ушла в очередь.
  function give(mode, takeIdx, force) {
    var m = CUR && CUR.kind === 'card' ? CUR.model : null;
    if (!m || !m.open.length || DENIED || !cardInScope() || (!force && draftOn())) return false;
    if (mode === 'all' && ((!force && tooFresh()) || checkHold() || invHold())) return false;
    lastActivity = Date.now();
    var h = CUR.h, rows = m.open.slice();

    // пока «нет» не записано, счёт не спрашиваем (склад сверяет со счётом только вещи с номером), а запись могла лечь, пока открыто окно, —
    // ответ сброшен или отложен окном. Счёт спросит сама очередь перед отправкой этой выдачи, когда «нет» уже в таблице (wqInv). Иначе вещь из
    // оплаченного счёта ложилась в «Лог кассы» магазином [Кодекс, круг 2 v6.8, HIGH; Фейбл «деньги», круг 2 v6.8, MED-1 — окно «Не забрала
    // всё…»; LOW-1 обеих линз — окно «Заказ не отмечен»]. И выдача из окна «Заказ не отмечен» (force): окно переходит к заказу и выдаёт его
    // в том же щелчке — ответа про счёт у заказа, которого кассир не открывал, ещё нет [Фейбл «сценарий», круг 1 v6.9, MED-2].
    var invq = m.invChk === 'wait' && (force || WQ.concat(WQ_DONE).some(function (x) { return x.action === 'kassa_unnet' && x.tid === h.t.id && x.nick === m.c[0]; }));

    // Какие вещи уходят — как их выберет склад: из одинаковых по всем приметам — первые по порядку [Фейбл LOW-6]. Ими и отмечаем.
    var sel = mode === 'part' ? take.map(function (i) { return rows[i]; }) : rows;

    keys.forEach(function (k) { need[k] = (need[k] || 0) + 1; });

    var loc = localSums(m, done);

            keys: keys, g0: m.givenSel.length, mode: mode, cnt: done.length, tot: rows.length, t0: Date.now(), due: 0, tries: 0, legs: [], invq: invq ? 1 : 0 });
    applyGiven(m, done);     // сразу — как их покажет свежая выжимка (и overlayPack — любую, пришедшую до записи)
    if (CUR.lv) CUR.lv.done[nk(m.no)] = 1;                // заказ отмечен (п.3): окно «Заказ не отмечен» про него больше не спросит

  // ⏳ «СНЯТЬ «НЕТ»» НА ФОНЕ (п.6 v6.7) [владелец 29.09.2026: «снятие net не работает на фоне - кнопки зависли. Что интересно - в таблице
  // net снялось быстро (секунд за 10), а затем еще кнопки висели в течении секунд 60. Надо убрать на фон… В аппке товар моментом должен
  // становится зеленым, чтобы его можно было выдавать»]. Разбор «Лога кассы — скорость»: склад записал за 3–8 с, а касса ждала 44–54 с —

  //   • отказ — полосой с «×», вещь снова жёлтая (packReset); выдача с ней, если её уже нажали, получит от склада «заказ изменился» —
  //     своей полосой, с тем, что унёс клиент.
  // Цена на складе — та же одна запись kassa_unnet, что и раньше; сверки (сборки выжимки) после удачи больше нет — касса знает ответ склада.

    // иначе номер клиента); склад найдёт её заказ сам и скажет какой [Фейбл «корректность», LOW-3: из двух одинаковых

    // Заказ задания — тот, куда встала вещь (hint): на него карточка и переходит, по нему «своя» карточка узнаёт итог (finishWrite).
    wqAdd({ n: params.n, action: 'kassa_unnet', params: params, tid: h.t.id, tname: h.t.name, nick: m.c[0], no: hint, label: m.c[0] + ' ' + hint,

  // ── окна ──────────────────────────────────────────────────────────────────────────────

  // цифры, спрятаны и молчат (draftOn). Первые 0,4 с после открытия карточки тап глух: двойной тап по «Найти» цифры не открывает.
  numEl.addEventListener('click', function () {
    if (DESK.matches || abcOn || !CUR || CUR.kind !== 'card' || Date.now() - cardAt < 400) return;
    openPad();
    try { numEl.blur(); } catch (e) {}
  });
  // Цифры открыты на карточке — тап по карточке закрывает их, и только: кнопка под пальцем («Открыть этот заказ», «Снять
  // «нет»», фото) этим тапом не срабатывает — кассир сначала видит карточку с кнопками выдачи, потом действует.
  $('main').addEventListener('click', function (e) {
    if (!padOpen || !CUR || CUR.kind !== 'card') return;
    e.stopPropagation(); e.preventDefault(); closePad();
  }, true);
  $('zoom').onclick = function () { $('zoom').style.display = 'none'; $('zimg').removeAttribute('src'); };
  // Тап по строке состояния — «освежить сейчас»: идёт сверка — ещё раз сразу после неё (иначе тап глотался бы).
  $('sync').onclick = function () { lastActivity = Date.now(); sync(true); };
  // Выбрал закупку — курсор снова в поле поиска (компьютер): иначе стрелки тихо меняли бы закупку, пока фокус на списке.
  $('tbl').addEventListener('change', function () {
    var id = $('tbl').value;
    if (DESK.matches) {
      // Поиска ещё не было — курсор в конец набранного, без выделения: «71», выбор закупки, «1» = «711», а не «1»
      // [Фейбл «сценарий», круг 1 v6, L2]. Был — набранное выделено, как после поиска.
      var searched = !!CUR;
      keyFocus = !searched;
      try { numEl.focus(); if (!searched) { var L = numEl.value.length; numEl.setSelectionRange(L, L); } } catch (e) {}
      keyFocus = false;
    } else { try { $('tbl').blur(); } catch (e) {} }
    pickTable(id);
  });
  // Enter на списке закупок (открыл и закрыл без выбора) — поиск набранного, как Enter в поле [Фейбл «сценарий», круг 1 v6, L3].
  $('tbl').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    try { numEl.focus(); } catch (err) {}
    go();
  });
  // Выбрана прошлая закупка, а 10 мин никто ничего не делает — касса сама на самой свежей, поле пустое [владелец
  // 27.09.2026: «с утра пришёл клиент по старой закупке, работник её открыл, и потом старая закупка до конца дня будет
  // висеть»]. Набранное заново не ищем: тот же номер в свежей — чужой заказ. Пока открыто окно — не трогаем. Очередь фоновых записей
  // (выдачи и «снять «нет»») НЕ держит [v6.6]: её итог придёт строкой или полосой на любом экране, а застрявшая досылка
  // (повторы до 6 ч) иначе держала бы прошлую закупку весь день [Фейбл «очередь», круг 1 v6.6, LOW]. Телефон спал — проверка по
  // пробуждению, раньше, чем оно засчитается за действие кассира.
  var IDLE_BACK = 10 * 60000;
  function idleBack() {
    if (!SEL || DENIED || !TABLES || !TABLES.list.length || dlgOpen()) return false;
    if (Date.now() - lastActivity < IDLE_BACK) return false;
    keepFail();
    typed = ''; pendingSearch = ''; renderNum();
    CUR = null;   // запрос открытой карточки тоже не ищем: pickTable ищет его заново, раз поле на карточке пустое [28.09.2026]
    pickTable(TABLES.list[0].id);
    return true;
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || idleBack()) return;
    lastActivity = Date.now(); if (Date.now() - lastSyncAt > 60000) sync();
  });
  setInterval(function () {
    if (DENIED) return;
    idleBack();
    renderSync();
    renderWq();
    if (SPQ.length && !spTimer && !spBusy) spFlush();
    if (WQ.length && !wqBusy && !wqTimer) wqKick(0);
    if (document.visibilityState === 'visible' && Date.now() - lastActivity < ACTIVE_FOR && syncDue()) sync();
  }, 30000);

  // ── старт: сначала всё из памяти телефона, потом фоном — Google ─────────────────────────
  (async function boot() {
    fitInput(); renderNum(); showHome();
    if (DESK.matches) { try { numEl.focus(); } catch (e) {} }
    var dk = lsGet('kassa_denied');
    if (dk && dk === (KEY || '-')) {
      // Этот ключ склад уже не пускал: данных не читаем, но спрашиваем склад ещё раз.
      DENIED = true; showDeny();
      var r = await (function () { DENIED = false; return jsonp('kassa_tables', {}, WAIT_TABLES); })();
      // «404» от Google — не ответ склада: повторяем, как освежение [Фейбл соседней сессии, 28.09.2026: иначе «закройте и
      // откройте» после отказа иногда нужно было дважды]. Настоящий отказ (no_key) повтор прерывает сам — denied().
      for (var ra = 0; r && r.net && ra < 2 && !DENIED; ra++) { await sleep(2000); r = await jsonp('kassa_tables', {}, WAIT_TABLES); }
      if (!r || !r.ok) { DENIED = true; showDeny(); return; }
      lsSet('kassa_denied', ''); $('deny').style.display = 'none';
    }
    try {
      DB = await idbOpen();
      // Очередь записей прошлого сеанса (закрыли вкладку, перезапустили компьютер) — досылаем тем же кодом [v6.6].
      var saved = await idbList('wq_');
      saved.filter(function (j) { return j && j.n && j.action && j.params; }).sort(function (x, y) { return (x.t0 || 0) - (y.t0 || 0); })
        .forEach(function (j) { if (!WQ.some(function (x) { return x.n === j.n; })) { j.due = 0; j.fly = 0; WQ.push(j); } });
      var st0 = await idbGet('sticky');                         // отказы записи, которые кассир ещё не закрыл «×» [v6.6]
      if (Array.isArray(st0) && st0.length) {
        STICKY = st0.filter(function (x) { return x && typeof x.text === 'string' && /^(bad|warn)$/.test(String(x.cls)); }).concat(STICKY).slice(-STICKY_MAX);
        renderSticky();
      }
      renderWq();
      var tb = await idbGet('tables');
      if (tb && tb.list && tb.list.length) {
        TABLES = { at: tb.at, list: tb.list, checked: 0 };     // из памяти — не сверен в этом сеансе
        await loadPack(selT());                                // только самая свежая: остальные — когда кассир выберет
      }
    } catch (e) { DB = null; }
    if (DENIED) return;
    renderTbl(); renderSync(); if (!CUR) showHome();
    sync();
    if (WQ.length) wqKick(0);
  })();
  // Закрыть вкладку, пока склад не подтвердил выдачу, — браузер переспросит [v6.6]: очередь и так в памяти браузера и уйдёт при
  // следующем открытии кассы, но кассир должен знать, что запись ещё не на складе.
  $('wq').onclick = function () { try { $('head').scrollTop = 0; $('main').scrollTop = 0; window.scrollTo(0, 0); } catch (e) {} };
  window.addEventListener('beforeunload', function (e) { if (WQ.length && !DENIED) { var w = 'Склад ещё не подтвердил выдачу'; e.preventDefault(); e.returnValue = w; return w; } });

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  // Новая версия страницы: сторож тянет её в фоне; при возврате в кассу просим проверить обновление.
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(function (reg) {
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { try { reg.update(); } catch (e) {} } });
  }).catch(function () {});
})();
</script>
</body>
</html>
