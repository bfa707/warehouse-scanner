<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- ⚠️ Страница закрыта от поисковиков [владелец, коммит noindex в репозитории Pages]. Держим
     мету ЗДЕСЬ, в источнике: без неё каждая следующая выкладка сканера её молча стирала. -->
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- открытие как полноэкранное приложение (без панелей Safari), если добавить на экран «Домой» -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Сканер">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>Склад</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #000; position: sticky; top: 0; z-index: 5; }
  .bar h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .bar .back { color: #6cb2ff; text-decoration: none; font-size: 18px; }
  /* Компактность — за счёт обрезки контейнером, видео НЕ трогаем (иначе сканер
     читает не то, что видно, и не ловит код). overflow прячет верх/низ кадра,
     центр (куда наводят QR) виден и распознаётся. */
  .cam-wrap { position: relative; width: 100%; max-width: 440px; margin: 8px auto 0; }
  #reader { width: 100%; height: 250px; position: relative; overflow: hidden;
            border-radius: 12px; background: #000; }
  #reader:empty { display: none; }                 /* камера выключена — не занимает место */
  #reader video { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                  width: 100% !important; height: auto !important; display: block; }
  /* рамка-прицел: держи QR внутри неё — тогда и расстояние, и белое поле верные */
  .aim { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
         width: 165px; height: 165px; border: 3px solid rgba(255,255,255,.85);
         border-radius: 12px; pointer-events: none; display: none; transition: border-color .12s, box-shadow .12s; }
  /* поймали QR — рамка зеленеет (визуальный отклик, что код считан) */
  .aim.caught { border-color: #34d058; box-shadow: 0 0 0 4px rgba(52,208,88,.35), 0 0 18px rgba(52,208,88,.5); }
  /* «код считан», ответа сервера ещё нет — НЕЙТРАЛЬНЫЙ жёлтый, не зелёный (HIGH-3) */
  .aim.seen { border-color: #f0c040; box-shadow: 0 0 0 3px rgba(240,192,64,.28); }
  /* ручная замена отправлена, ответа сервера ещё нет: НЕ зелёный, иначе он читается как готово
     [круг Фейбла 06.09.2026, LOW-2 — правило .saving отсутствовало, и бейджик оставался зелёным] */
  .obadge.done.saving { background: #3b3418; border-left-color: #e8a317; }
  /* при qrbox html5-qrcode рисует свою рамку/затемнение — прячем её, оставляем свой .aim */
  #qr-shaded-region { display: none !important; }
  .start { display: block; width: calc(100% - 32px); max-width: 380px; margin: 16px auto 6px;
           font-size: 20px; font-weight: 700; background: #0b8043; color: #fff; border: none;
           border-radius: 12px; padding: 16px 20px; cursor: pointer; }
  .hint { color: #888; font-size: 13px; text-align: center; }
  .err  { color: #ff7676; text-align: center; padding: 14px 16px; font-size: 16px; }
  .head { display: flex; align-items: center; justify-content: space-between;
          max-width: 640px; margin: 8px auto 0; padding: 0 16px; }
  .head h2 { font-size: 16px; color: #aaa; font-weight: 500; margin: 14px 0 8px; }
  .clear { background: none; color: #6cb2ff; border: none; font-size: 15px; cursor: pointer; }
  .showall { display: block; margin: 0 auto 10px; background: #1d1d1d; color: #6cb2ff;
             border: none; border-radius: 10px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .list { max-width: 640px; margin: 0 auto; padding: 0 16px 28px; }
  /* свёрнуто: в DOM держим только 7 свежих карточек видимыми, старые скрыты —
     меньше нагрузка на телефон, сканер не захлёбывается при серийном скане */
  .list:not(.show-all) .card:nth-child(n+8) { display: none; }

  /* карточка отсканированной единицы (горизонтально: фото+код | инфо | счётчики справа-внизу) */
  .card { position: relative; display: flex; align-items: flex-start; gap: 12px;
          background: #1d1d1d; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
          border-left: 5px solid #555; cursor: pointer; }
  /* фон по ЦВЕТУ-РАЗМЕРУ: 10 неброских тёмных оттенков ИЗ РАЗНЫХ семейств, чередуются по
     порядку появления — соседние цвета-размеры заметно различаются (серый→синий→коричневый
     →фиолетовый→стальной→тёплый→тёмно-синий→сливовый→хаки→слейт), одинаковые — один фон */
  .card.bg0 { background: #2a2a2a; }   /* серый */
  .card.bg1 { background: #1e3142; }   /* синий */
  .card.bg2 { background: #342a20; }   /* коричневый */
  .card.bg3 { background: #2c2542; }   /* фиолетовый */
  .card.bg4 { background: #24343f; }   /* стальной */
  .card.bg5 { background: #3a2e2c; }   /* тёплый серо-коричневый */
  .card.bg6 { background: #1e2840; }   /* тёмно-синий */
  .card.bg7 { background: #342940; }   /* сливовый */
  .card.bg8 { background: #38322a; }   /* хаки-коричневый */
  .card.bg9 { background: #2a3640; }   /* слейт-синий */
  /* всё принято (скан == закуплено) → тёмно-зелёный фон (перекрывает оттенок) */
  .card.full { background: #15351f; }
  .card.ok   { border-left-color: #0b8043; }   /* учтено в таблице (кол-во изменилось) */
  .card.dup  { border-left-color: #d93025; }   /* уже было пропикано ранее */
  .card.bad  { border-left-color: #d93025; }
  .card.warn { border-left-color: #e8a317; }
  .card.loading { border-left-color: #e8a317; }  /* отсканировано, пишу в таблицу (ещё не учтено) */
  .card .del { position: absolute; top: 4px; right: 6px; width: 32px; height: 32px;
               border: none; background: transparent; color: #888; font-size: 20px;
               line-height: 1; padding: 0; cursor: pointer; z-index: 1; }
  .card .del:active { color: #fff; }
  /* лёгкое НЕблокирующее подтверждение (нативный confirm() морозит камеру на iOS) */
  .askc { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
          background: rgba(0,0,0,.6); padding: 24px; }
  .askc.show { display: flex; }
  .askc-box { background: #1f1f1f; border: 1px solid #444; border-radius: 16px; max-width: 360px; width: 100%;
              padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  .askc-msg { font-size: 17px; color: #eee; font-weight: 600; text-align: center; margin-bottom: 16px; line-height: 1.3; }
  .askc-btns { display: flex; gap: 10px; }
  .askc-btns button { flex: 1; border: none; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .askc-yes { background: #d93025; color: #fff; }
  .askc-no  { background: #444; color: #ddd; }
  /* колонка с фото: ПОД фоткой — код единицы (как на распечатке под QR) */
  .card .thumbcol { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .card .thumb { width: 64px; height: 64px; flex-shrink: 0; border-radius: 8px;
                 overflow: hidden; background: #333; display: flex;
                 align-items: center; justify-content: center; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .thumb .ph { color: #888; font-size: 24px; }
  .card .unitno { font-size: 13px; color: #8ab4f8; text-align: center; max-width: 76px;
                  font-family: ui-monospace, Menlo, monospace; }   /* код единицы — под фото */
  .card .meta { flex: 1; min-width: 0; padding-right: 22px; }   /* место под крестик */
  /* имя + цена в ОДНУ строку: длинное название обрезается, цена не пропадает */
  .card .name { display: flex; align-items: baseline; font-size: 18px; font-weight: 600; line-height: 1.2; }
  .card .name .nm-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .name .pr { flex-shrink: 0; color: #9a9a9a; font-weight: 600; font-size: 0.78em;
                    margin-left: 0.6em; white-space: nowrap; }   /* цена — мельче, светло-серым */
  /* «цвет:»/«размер:» — серым (как было); САМО значение — белым (п.2) */
  .card .attr { font-size: 14px; color: #bbb; margin-top: 3px; }
  .card .attr .val { color: #fff; }
  .card .attr:empty { display: none; }
  .card .dupnote { color: #ff6b6b; font-size: 12px; font-weight: 600; margin-top: 4px; line-height: 1.2; }
  .card .dupnote:empty { display: none; }
  /* счётчики «закуп/скан» — СТОПКОЙ в правом-нижнем углу, БЕЗ расширения карточки (п.1) */
  .card .counts { flex-shrink: 0; align-self: stretch; display: flex; flex-direction: column;
                  justify-content: flex-end; align-items: flex-end;
                  font-size: 14px; color: #9a9a9a; line-height: 1.35; }
  /* тап по карточке → вместо инфо показать список напечатанных наклеек */
  .card .labels { display: none; }
  .card.show-labels .thumbcol, .card.show-labels .meta, .card.show-labels .counts { display: none; }
  .card.show-labels .labels { display: block; font-size: 14px; line-height: 1.7; }
  .card .labels .lt { color: #9a9a9a; }       /* подпись-заголовок */
  .card .labels .done { color: #4cc76a; }     /* отсканированные — зелёным */
  .card .labels .undone { color: #ff6b6b; }   /* неотсканированные — красным */

  /* ─── Режим «Собрать заказ» ─── */
  body.order-mode .head { display: none; }           /* счётчик приёмки не нужен */
  body.order-mode #reader { height: 180px; }          /* окно сканера компактнее */
  #order-head { max-width: 640px; margin: 6px auto 0; padding: 0 16px; display: none; }
  body.order-mode #order-head { display: block; }
  #order-title { font-size: 19px; font-weight: 700; margin: 8px 0 2px; line-height: 1.25; }
  #order-progress { font-size: 15px; color: #bbb; }
  #order-progress.done { color: #4cc76a; font-weight: 700; }
  /* баннер результата скана — мигает на каждый скан */
  #scan-status { max-width: 640px; margin: 8px auto 0; padding: 0 16px; display: none; }
  body.order-mode #scan-status.show { display: block; }
  #scan-status .msg { border-radius: 10px; padding: 10px 14px; font-size: 16px; font-weight: 600; }
  #scan-status.ok   .msg { background: #15351f; color: #7ee2a0; }
  #scan-status.bad  .msg { background: #3a1715; color: #ff9a93; }
  #scan-status.warn .msg { background: #3a3115; color: #ffd98a; }
  /* сетка бейджиков заказанных товаров */
  #order-grid { max-width: 640px; margin: 8px auto 0; padding: 0 16px 28px; display: none; }
  body.order-mode #order-grid { display: block; }
  .ord-empty { color: #888; text-align: center; padding: 24px 8px; font-size: 16px; }
  .obadge { position: relative; display: flex; align-items: flex-start; gap: 12px;
            background: #1d1d1d; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
            border-left: 5px solid #555; }
  .obadge.part { border-left-color: #e8a317; }    /* выдано частично */
  .obadge.done { border-left-color: #0b8043; background: #1d6f3b; }  /* выдано — ВЕСЬ бейджик зелёный */
  .obadge.net  { border-left-color: #9a6b00; opacity: 0.75; }        /* не хватило (net) */
  .obadge.flash { animation: oflash 0.6s ease; }
  @keyframes oflash { 0% { background: #1f5a33; } 100% { background: #1d1d1d; } }
  .obadge.done.flash { animation: oflashdone 0.6s ease; }
  @keyframes oflashdone { 0% { background: #2a7a46; } 100% { background: #15351f; } }
  .obadge .othumb { width: 56px; height: 56px; flex-shrink: 0; border-radius: 8px; overflow: hidden;
                    background: #333; display: flex; align-items: center; justify-content: center; }
  .obadge .othumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .obadge .othumb .ph { color: #888; font-size: 22px; }
  .obadge .ometa { flex: 1; min-width: 0; }
  .obadge .oname { font-size: 16px; font-weight: 600; line-height: 1.2;
                   overflow: hidden; text-overflow: ellipsis; }
  .obadge .oattr { font-size: 14px; color: #bbb; margin-top: 3px; }
  .obadge .oattr .val { color: #fff; }
  .obadge .ochip { flex-shrink: 0; align-self: center; font-size: 17px; font-weight: 700;
                   color: #9a9a9a; min-width: 52px; text-align: right; }
  .obadge.part .ochip { color: #ffce73; }
  .obadge.done .ochip { color: #7ee2a0; }
  .obadge.net  .ochip { color: #d99b4a; font-size: 13px; }
  /* чип = колонка: галка/статус сверху, под ней код наклейки */
  .obadge .ochip { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 2px; }
  .obadge .ocode { font-size: 12px; font-weight: 700; color: #7ee2a0; font-family: ui-monospace, Menlo, monospace; }
  .obadge .ocode:empty { display: none; }
  .obadge.done { cursor: pointer; }                  /* тап по зелёному бейджику = снять выдачу */
  /* в режиме заказа нижняя лента приёмки не нужна — всё через бейджики и попап */
  body.order-mode #list, body.order-mode #showall { display: none; }

  /* ─── Попап «Товар отличается от заказа» ─── */
  .mpop { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center;
          background: rgba(0,0,0,.72); padding: 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .mpop-panel { background: #1b1b1b; border: 1px solid #4a3c14; border-radius: 16px; width: 100%;
                max-width: 560px; margin: auto 0; padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  .mpop-title { font-size: 18px; font-weight: 800; color: #ff6b6b; line-height: 1.3; margin-bottom: 4px; }
  .mpop-title .x { font-weight: 900; margin-right: 4px; }
  .mpop-title.warn { color: #e8a317; }            /* несовпадение/лишняя вещь — жёлтым (предупреждение, не «ошибка») */
  .mpop-pick.warn { color: #e8a317; }             /* жёлтая подсказка-причина */
  .cs-row { line-height: 1.3; }                   /* цвет и размер — каждый на своей строке (размер ПОД цветом) */
  .cs-row.hl, .cs-row.hl .val { color: #f5c518 !important; font-weight: 700; }   /* жёлтым — что именно не совпало */
  .mpop-scan .mname.hl { color: #f5c518; }         /* жёлтым № и название, когда товар не тот */
  .mpop-sub { font-size: 13px; color: #aaa; margin-bottom: 12px; }
  .mpop-scan { display: flex; gap: 14px; background: #241d0f; border-radius: 12px; padding: 12px; margin-bottom: 14px; }
  .mpop-scan .mphoto { width: 104px; height: 104px; flex-shrink: 0; border-radius: 10px; overflow: hidden;
                       background: #333; display: flex; align-items: center; justify-content: center; }
  .mpop-scan .mphoto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mpop-scan .mphoto .ph { color: #888; font-size: 32px; }
  .mpop-scan .minfo { flex: 1; min-width: 0; }
  .mpop-scan .mname { font-size: 17px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
  .mpop-scan .mrow { font-size: 14px; color: #bbb; margin-top: 2px; }
  .mpop-scan .mrow .val { color: #fff; }
  .mpop-pick { font-size: 14px; color: #ddd; font-weight: 600; margin: 4px 2px 8px; }
  .mpop-list { display: flex; flex-direction: column; gap: 8px; }
  .mob { display: flex; align-items: center; gap: 12px; background: #232323; border-radius: 12px;
         padding: 10px 12px; border-left: 5px solid #555; }
  .mob.pick { cursor: pointer; } .mob.pick:active { background: #2c2c2c; }
  .mob.disabled { opacity: .45; }
  .mob.done { border-left-color: #0b8043; } .mob.net { border-left-color: #9a6b00; }
  .mob .mob-thumb { width: 46px; height: 46px; flex-shrink: 0; border-radius: 8px; overflow: hidden;
                    background: #333; display: flex; align-items: center; justify-content: center; }
  .mob .mob-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mob .mob-thumb .ph { color: #888; font-size: 18px; }
  .mob .mob-meta { flex: 1; min-width: 0; }
  .mob .mob-name { font-size: 15px; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mob .mob-attr { font-size: 13px; color: #bbb; margin-top: 2px; }
  .mob .mob-attr .val { color: #fff; }
  .mob .mob-state { font-size: 12px; margin-top: 2px; color: #9a9a9a; }
  .mob.done .mob-state { color: #7ee2a0; } .mob.net .mob-state { color: #d99b4a; }
  .mob .mob-check { width: 30px; height: 30px; flex-shrink: 0; border: none;   /* без зелёной рамки вокруг галочки */
                   display: flex; align-items: center; justify-content: center; color: #7ee2a0; font-size: 22px; font-weight: 800; }
  .mob.sel .mob-check { color: #7ee2a0; }            /* при нажатии — галочка зелёная */
  .mob.disabled .mob-check { color: transparent; }
  .mpop-foot { margin-top: 14px; }
  .mpop-close { width: 100%; background: #2a2a2a; color: #ddd; border: none; border-radius: 12px;
                padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .mpop-queue { text-align: center; color: #9fd3ad; font-size: 13px; margin-top: 8px; }
  .mpop-queue:empty { display: none; }

  /* поймали QR на УЖЕ отсканированной наклейке — рамка краснеет (п.7) */
  .aim.dup { border-color: #ff4d4f; box-shadow: 0 0 0 4px rgba(255,77,79,.35), 0 0 18px rgba(255,77,79,.55); }
  /* красная плашка поверх сканера: «Уже отсканировали ранее» (исчезает сама) */
  .scan-toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 7;
                background: rgba(217,48,37,.96); color: #fff; font-weight: 700; font-size: 15px;
                padding: 9px 15px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.45);
                display: none; max-width: 90%; text-align: center; line-height: 1.25; }
  .scan-toast.show { display: block; }

  /* крестик в углу бейджика (п.4): снятие выдачи ТОЛЬКО по нему, не по тапу всего бейджика */
  .obadge .obadge-del { position: absolute; top: 3px; right: 5px; width: 30px; height: 30px; border: none;
                        background: transparent; color: #cfe8d6; font-size: 20px; line-height: 1; padding: 0;
                        cursor: pointer; z-index: 2; display: none; }
  .obadge.done .obadge-del { display: block; }
  .obadge .obadge-del:active { color: #fff; }

  /* ─── Попап «Заказ собран» (п.8) ─── */
  .odone { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center;
           background: rgba(0,0,0,.82); padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .odone.show { display: flex; }
  .odone-panel { background: #15351f; border: 1px solid #2a7a46; border-radius: 18px; width: 100%;
                 max-width: 460px; margin: auto; padding: 22px 18px; text-align: center;
                 box-shadow: 0 16px 50px rgba(0,0,0,.7); }
  .odone-check { font-size: 62px; line-height: 1; }
  .odone-title { font-size: 23px; font-weight: 800; color: #fff; margin: 10px 0 6px; line-height: 1.25; }
  .odone-sum { font-size: 18px; color: #bfeccb; font-weight: 600; margin-bottom: 14px; }
  .odone-list { text-align: left; background: rgba(0,0,0,.25); border-radius: 12px; padding: 8px 12px;
                margin-bottom: 16px; max-height: 38vh; overflow-y: auto; }
  .odone-item { font-size: 15px; color: #e8f5ec; padding: 5px 0; line-height: 1.3;
                border-bottom: 1px solid rgba(255,255,255,.07); }
  .odone-item:last-child { border-bottom: none; }
  .odone-item .oi-attr { color: #9fd3ad; font-size: 13px; }
  .odone-btns { display: flex; gap: 10px; }
  .odone-btns button { flex: 1; border: none; border-radius: 12px; padding: 14px; font-size: 17px; font-weight: 700; cursor: pointer; }
  .odone-close { background: #0b8043; color: #fff; }
  .odone-fix { background: #2a2a2a; color: #ddd; }
</style>
</head>
<body>
  <div class="bar"><a id="back" class="back" href="#" style="display:none">← Назад</a></div>

  <div class="cam-wrap">
    <div id="reader"></div>
    <div class="aim" id="aim"></div>
    <div class="scan-toast" id="scan-toast"></div>
  </div>
  <button id="start" class="start" type="button">▶ Включить камеру</button>
  <div id="err" class="err"></div>

  <!-- режим «Собрать заказ»: шапка (ник/сумма/прогресс), баннер результата, бейджики -->
  <div id="order-head"><div id="order-title">Загрузка заказа…</div><div id="order-progress"></div></div>
  <div id="scan-status"><div class="msg"></div></div>
  <div id="order-grid"></div>
  <!-- попап «Товар отличается от заказа» (наполняется из openMismatchPopup) -->
  <div id="mismatch-popup" class="mpop" style="display:none"></div>
  <!-- попап «Заказ собран» (наполняется из showOrderDonePopup) -->
  <div id="order-done-popup" class="odone"></div>
  <!-- НЕблокирующее подтверждение (askConfirm) — заменяет нативный confirm(), который морозит камеру на iOS -->
  <div id="askc" class="askc"><div class="askc-box"><div class="askc-msg"></div>
    <div class="askc-btns"><button type="button" class="askc-no">Нет</button><button type="button" class="askc-yes">Да</button></div></div></div>

  <div class="head"><h2 id="cnt">Отсканировано: 0</h2><button id="clear" class="clear" type="button">Очистить</button></div>
  <div id="list" class="list"></div>
  <button id="showall" class="showall" type="button" style="display:none"></button>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    // Адрес склада (/exec) приходит параметром ?back=… от приложения. Он же —
    // и ссылка «← Назад», и база для запросов данных о товаре (action=lookup).
    // Параметры из адреса: back=… (адрес склада /exec), и для режима заказа —
    // mode=order, src=<srcId таблицы>, no=<№ заказа>, nick=<ник>.
    function qparam(k) {
      var m = location.search.match(new RegExp('[?&]' + k + '=([^&]*)'));
      return m ? decodeURIComponent(m[1]) : '';
    }
    var GAS = '';
    var MODE = qparam('mode'), SRC = qparam('src'), ORDER_NO = qparam('no'), ORDER_NICK = qparam('nick');
    (function () {
      var back = qparam('back');
      if (back) {
        GAS = back;
        var b = document.getElementById('back');
        b.href = GAS;                        // запасной вариант (если нет истории)
        b.style.display = '';
        // Быстрый возврат: шаг назад по истории — айфон достаёт страницу склада
        // из памяти моментально, без долгой перезагрузки веб-приложения.
        b.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();                      // не запускать камеру при выходе
          // Незавершённые повторы/привязки не бросаем молча (CRIT-1) — спрашиваем.
          if (typeof warnIfPending === 'function') warnIfPending(leaveToWarehouse);
          else leaveToWarehouse();
        });
      }
    })();

    var qr = null, seen = {}, total = 0;
    // ДВА РАЗНЫХ ЧИСЛА [ревью Кодекса 06.09.2026, LOW-1]: total — сколько кодов ПРОЧИТАЛА камера,
    // accepted — сколько вещей сервер РЕАЛЬНО принял (новый переход). Раньше показывали только
    // первое, и оно случайно совпадало с числом вещей в коробке, хотя дубли, «нет в журнале» и
    // упавшие запросы тоже прибавляли единицу — коробку закрывали с недостающей записью.
    var accepted = 0, rejected = 0;
    function renderReceiptCount() {
      var el = document.getElementById('cnt');
      if (!el) return;
      el.textContent = 'Принято: ' + accepted + ' · считано: ' + total
                     + (rejected ? ' · не принято: ' + rejected : '');
    }

    // Возврат на склад (кнопка «Назад» и «Закрыть» в попапе «Заказ собран»): моментально
    // накрываем экран «Загрузка…» (чтобы не было видно, как сканер «съезжает» при гашении
    // камеры), отпускаем камеру и уходим шагом по истории (айфон достаёт склад из памяти быстро).
    function leaveToWarehouse() {
      var lv = document.getElementById('leaving');
      if (!lv) {
        lv = document.createElement('div'); lv.id = 'leaving';
        lv.style.cssText = 'position:fixed;inset:0;z-index:100000;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#9aa0a6;font:600 17px -apple-system,system-ui,sans-serif';
        lv.textContent = '📦 Загрузка…'; document.body.appendChild(lv);
      }
      lv.style.display = 'flex';
      try { if (qr) { var q = qr; qr = null; q.stop().then(function () { q.clear(); }).catch(function () {}); } } catch (_) {}
      if (history.length > 1) history.back(); else if (GAS) location.href = GAS;
    }

    var startBtn = document.getElementById('start');
    var aim      = document.getElementById('aim');
    var errBox   = document.getElementById('err');
    var listEl   = document.getElementById('list');
    var cntEl    = document.getElementById('cnt');
    var showAllBtn = document.getElementById('showall');

    // Отпустить камеру при уходе со страницы (надёжный «один тап» на iOS даже через
    // системный жест «назад»): живой видеотрек иначе задерживает выгрузку страницы.
    window.addEventListener('pagehide', function () {
      try { if (qr) { var q = qr; qr = null; q.stop().catch(function () {}); } } catch (_) {}
    });

    // Неблокирующее подтверждение: нативный confirm()/alert() во время активной камеры
    // на iOS подвешивает декодер, и превью не оживает. askConfirm(текст, onYes) показывает
    // лёгкий оверлей с «Да»/«Нет», не блокируя event-loop и видеопоток.
    var _askcWired = false;
    function askConfirm(msg, onYes) {
      var box = document.getElementById('askc');
      box.querySelector('.askc-msg').textContent = msg || 'Подтвердить?';
      box._onYes = onYes || function () {};
      if (!_askcWired) {
        _askcWired = true;
        box.addEventListener('click', function (e) {
          e.stopPropagation();                                  // тап в оверлее не запускает камеру
          if (e.target === box || (e.target.closest && e.target.closest('.askc-no'))) { box.classList.remove('show'); box._onYes = null; return; }
          if (e.target.closest && e.target.closest('.askc-yes')) {
            box.classList.remove('show');
            var f = box._onYes; box._onYes = null; if (f) f();
          }
        });
      }
      box.classList.add('show');
    }

    function showErr(t) { errBox.textContent = t || ''; }

    // Свёрнутый список: видны 7 свежих карточек, старые прячем (легче телефону).
    // Кнопка разворачивает/сворачивает всю историю текущей сессии.
    function updateShowAll() {
      var n = listEl.children.length;
      if (n > 7) {
        showAllBtn.style.display = 'block';
        showAllBtn.textContent = listEl.classList.contains('show-all')
          ? 'Свернуть до 7 свежих'
          : ('Показать все (' + n + ')');
      } else {
        showAllBtn.style.display = 'none';
        listEl.classList.remove('show-all');
      }
    }
    showAllBtn.addEventListener('click', function () {
      listEl.classList.toggle('show-all');
      updateShowAll();
    });

    // ОДИН AudioContext на сессию [ревью Кодекса 06.09.2026, ускорение №11]: раньше каждый писк
    // создавал новый и не закрывал его — на серии из 30 вещей телефон копил объекты, звук мог
    // отвалиться совсем. Контекст возобновляем (iOS отдаёт его 'suspended' до касания экрана).
    var _ac = null;
    function audioCtx() {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        if (!_ac) _ac = new AC();
        if (_ac.state === 'suspended' && _ac.resume) { try { _ac.resume(); } catch (e) {} }
        return _ac;
      } catch (e) { return null; }
    }
    function beep() {
      try {
        var ac = audioCtx();
        if (!ac) return;
        var o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.frequency.value = 880; o.start();
        g.gain.setValueAtTime(0.2, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.15);
        o.stop(ac.currentTime + 0.16);
      } catch (e) {}
    }

    // Вибрация (п.2): зелёный скан — 1 короткая; красная рамка «уже сканировали» — 2 коротких.
    function vibeOk()  { try { if (navigator.vibrate) navigator.vibrate(55); } catch (e) {} }
    function vibeDup() { try { if (navigator.vibrate) navigator.vibrate([55, 90, 55]); } catch (e) {} }
    // «код считан» — НЕЙТРАЛЬНЫЙ отклик [ревью Кодекса 06.09.2026, HIGH-3]. Раньше в режиме заказа
    // сразу давали ЗЕЛЁНЫЙ + успешную вибрацию, а сервер только через 4,4–7,0 с мог ответить
    // «не тот размер / не из этого заказа». Работник к тому моменту уже смотрел на следующую вещь
    // и клал непривязанную вещь в посылку. Теперь: тихая короткая вибрация = «увидел код»,
    // зелёный — только по подтверждению сервера.
    function vibeSeen() { try { if (navigator.vibrate) navigator.vibrate(18); } catch (e) {} }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function nowTime() {
      var d = new Date();
      return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    // Короткий код единицы из порядкового номера (хвост UnitID): 1→AA001 … 999→AA999 → AB001…
    // То же, что печатается на наклейке — работник сверяет «№ AA001» на ярлыке и в карточке.
    function seqToCode(seq) {
      seq = parseInt(seq, 10);
      if (!seq || seq < 1) return '';
      var n = seq - 1, num = (n % 999) + 1, g = Math.floor(n / 999), letters = '';
      do { letters = String.fromCharCode(65 + (g % 26)) + letters; g = Math.floor(g / 26); } while (g > 0);
      while (letters.length < 2) letters = 'A' + letters;   // минимум две буквы: AA…
      return letters + ('00' + num).slice(-3);
    }

    // экранирование для вставки через innerHTML (имя товара может содержать <, & и т.п.)
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    // ─── Подробный диагностический лог (п.7) ───────────────────────────────────
    // Видно КАЖДОЕ действие сканера и сколько мс оно заняло: камера→запрос→ответ→отрисовка,
    // + серверные тайминги (data.t) и ПРИЧИНУ решения (data.dbg: почему overscan/ok и т.д.).
    // Маленькая кнопка «лог» внизу справа показывает панель; ?debug=1 в адресе открывает сразу.
    // Лог пишется в память всегда (дёшево), на экране — только когда панель открыта.
    var DBG = qparam('debug') === '1';
    function perfNow() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
    function dnum(x) { return (x == null) ? '?' : Math.round(x); }
    var DLINES = [];
    function dlog(kind, code, info) {
      try {
        info = info || {};
        var c = code ? seqToCode(String(code).split('-').pop()) : '';
        var p = ['[' + nowTime() + ']', kind];
        if (c) p.push(c);
        if (info.res != null)   p.push('=' + info.res);
        if (info.err)           p.push('ОШ:' + info.err);
        if (info.net != null)   p.push('сеть:' + dnum(info.net) + 'мс');
        if (info.total != null) p.push('итого:' + dnum(info.total) + 'мс');
        if (info.srv) p.push('сервер:' + dnum(info.srv.total) + 'мс(лог' + dnum(info.srv.log) + '/тов' + dnum(info.srv.item)
          + (info.srv.order != null ? '/зак' + dnum(info.srv.order) : '')
          + (info.srv.sales != null ? '/выд' + dnum(info.srv.sales) : '')
          + '/зап' + dnum(info.srv.write) + ')');
        if (info.msg)           p.push(info.msg);
        if (info.dbg)           p.push('| ' + info.dbg);
        var line = p.join(' ');
        DLINES.push(line); if (DLINES.length > 120) DLINES.shift();
        try { console.log('[DBG]', line); } catch (e) {}
        renderDbgPanel();
      } catch (e) {}
    }
    function renderDbgPanel() {
      var el = document.getElementById('dbg-panel');
      if (!el || el.style.display === 'none') return;
      el.textContent = DLINES.slice().reverse().join('\n');
    }
    function ensureDbgUI() {
      if (document.getElementById('dbg-btn')) return;
      var btn = document.createElement('button');
      btn.id = 'dbg-btn'; btn.type = 'button'; btn.textContent = 'лог';
      btn.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:100001;background:#222;color:#6cb2ff;border:1px solid #444;border-radius:8px;padding:6px 11px;font-size:13px;opacity:.8';
      var clr = document.createElement('button');
      clr.id = 'dbg-clr'; clr.type = 'button'; clr.textContent = 'очистить';
      clr.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:100001;background:#222;color:#f99;border:1px solid #444;border-radius:8px;padding:6px 11px;font-size:13px;display:none';
      var pan = document.createElement('div');
      pan.id = 'dbg-panel';
      pan.style.cssText = 'position:fixed;left:0;right:0;bottom:0;height:44vh;z-index:100000;background:rgba(0,0,0,.93);color:#cfe7ff;font:11px/1.5 ui-monospace,Menlo,monospace;padding:8px 10px 40px;overflow:auto;display:none;white-space:pre-wrap;border-top:2px solid #356';
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var show = pan.style.display === 'none';
        pan.style.display = show ? 'block' : 'none';
        clr.style.display = show ? 'block' : 'none';
        if (show) renderDbgPanel();
      });
      clr.addEventListener('click', function (e) { e.stopPropagation(); DLINES = []; renderDbgPanel(); });
      document.body.appendChild(pan); document.body.appendChild(btn); document.body.appendChild(clr);
      if (DBG) { pan.style.display = 'block'; clr.style.display = 'block'; renderDbgPanel(); }
    }
    try { ensureDbgUI(); } catch (e) {}

    // Запрос к складу через JSONP (обход CORS для внешней страницы).
    //   action=activate   — скан: отметить «принято» + вернуть карточку товара
    //   action=deactivate — крестик: снять отметку
    // onData получает объект {found,name,variant,photoUrl,...} либо null (нет связи).
    // ── Повтор ТРАНСПОРТНЫХ сбоев с тем же ключом операции ────────────────────────────────────
    // [ревью Кодекса «живучесть» 06.09.2026, HIGH] Повтор был только у приёмки и выдачи. У «снять
    // выдачу», «привязать» и крестика приёмки его не было вовсе: один обрыв связи или занятый
    // склад — и операции не случилось, хотя экран уже сказал «Выдача снята».
    // Повторяем ТОЛЬКО транспортные исходы: нет ответа (data == null) и 'busy'. Содержательный
    // отказ сервера («не из этого заказа», «уже выдано другому») повторять нельзя — он не изменится
    // и второй раз только запутает.
    // Ключ операции op у всех попыток ОДИН: если запись на самом деле прошла, а ответ потерялся,
    // сервер отдаст исходный результат и второй раз в лист не полезет.
    var RETRY_DELAYS = [1500, 3000, 6000];      // три попытки; дальше честно говорим человеку
    // Привязка держит работницу у экрана («Сохраняю…», выход ждёт ответа), поэтому ей одна попытка
    // повтора вместо трёх [круг Фейбла 06.09.2026, LOW-2]: иначе при мёртвой связи выход блокировался
    // бы почти на две минуты. Снятие и крестик идут фоном — им полные три.
    var RETRY_DELAYS_UI = [1500];
    function callGasRetry(action, uid, extra, onDone, onGiveUp) {
      var delays = (action === 'assign') ? RETRY_DELAYS_UI : RETRY_DELAYS;
      var op = (extra && extra.op) || newOpId(action, uid);
      var tries = 0;
      function attempt() {
        var ex = {}; for (var k in extra) ex[k] = extra[k];
        ex.op = op;                                  // тот же ключ на все попытки
        callGas(action, uid, function (data) {
          var transient = !data || data.error === 'busy';
          if (!transient) { jrnDone(op); onDone(data); return; }
          // Попытки кончились — из журнала НЕ убираем: доделаем при следующем открытии страницы.
          if (tries >= delays.length) { (onGiveUp || onDone)(data); return; }
          var wait = delays[tries++];
          RETRY_T[uid] = setTimeout(function () { delete RETRY_T[uid]; attempt(); }, wait);
        }, ex);
      }
      IN_FLIGHT[uid] = true;
      jrnAdd(action, uid, ex0());
      function ex0() { var e = {}; for (var k in extra) e[k] = extra[k]; e.op = op; return e; }
      attempt();
    }

    // ── ЖУРНАЛ СМЕНЫ: операции переживают перезагрузку страницы ────────────────────────────────
    // [ревью Кодекса «живучесть» 06.09.2026, HIGH] Всё состояние сканера жило только в памяти:
    // телефон перезагрузил страницу посреди серии из 20 вещей — и запросы, не дошедшие до сервера,
    // исчезали совсем, а дошедшие без ответа оставались в неизвестности. Работница переделывала
    // работу заново и уже не видела, что именно потерялось.
    //
    // Теперь каждая незавершённая операция лежит в localStorage телефона (сканер — отдельная
    // страница на своём домене, его хранилище аппка не стирает). При открытии страницы недоделанное
    // отправляется заново С ТЕМ ЖЕ ключом op: если сервер её уже выполнил, он отдаст исходный ответ
    // и второй раз в лист не полезет.
    //
    // ⚠️ Это НЕ гарантия: приватное окно, чистка данных браузера или смена телефона журнал уносят.
    // Поэтому он не молчаливый — при восстановлении показываем человеку, сколько наклеек доделываем.
    var JRN_KEY = 'wh_scan_journal_v1';
    var JRN_TTL = 6 * 60 * 60 * 1000;         // 6 часов: смена кончилась — старое не воскрешаем
    function jrnRead() {
      try {
        var raw = localStorage.getItem(JRN_KEY);
        if (!raw) return {};
        var o = JSON.parse(raw), now = Date.now(), out = {};
        Object.keys(o).forEach(function (k) { if (now - (o[k].at || 0) < JRN_TTL) out[k] = o[k]; });
        return out;
      } catch (e) { return {}; }             // хранилище недоступно — работаем как раньше
    }
    function jrnWrite(all) {
      try { localStorage.setItem(JRN_KEY, JSON.stringify(all)); } catch (e) {}
    }
    function jrnAdd(action, uid, extra) {
      var all = jrnRead();
      all[(extra && extra.op) || (action + '|' + uid)] =
        { action: action, uid: uid, extra: extra || {}, at: Date.now() };
      jrnWrite(all);
    }
    function jrnDone(op) {
      if (!op) return;
      var all = jrnRead();
      if (all[op]) { delete all[op]; jrnWrite(all); }
    }
    // Доделать недоделанное после перезагрузки. Зовём один раз при открытии страницы.
    // Сколько живёт серверная защита «этот же op уже сделан» (OPID_CACHE_TTL на сервере — 5 минут).
    // Старше — переигрывать РАЗРУШАЮЩЕЕ нельзя.
    var JRN_SAFE_REPLAY_MS = 5 * 60 * 1000;
    function jrnRestore() {
      var all = jrnRead(), keys = Object.keys(all);
      if (!keys.length) return;
      // ⚠️ СНЯТИЕ НЕ ПЕРЕИГРЫВАЕМ ВСЛЕПУЮ [круг Фейбла 06.09.2026, MED-3]. Пока запись лежала в
      // журнале, ту же наклейку могли снять и ВЫДАТЬ ЗАНОВО тому же заказу. Серверная сверка
      // «тот же заказ?» тогда совпадёт, и старое снятие молча сотрёт СВЕЖУЮ выдачу — работница
      // выдаст вторую вещь. Пока жива защита по ключу операции (5 минут) повтор безопасен: сервер
      // узнает его и ничего не сделает. Дальше — не гадаем, а просим человека проверить.
      var stale = [];
      keys = keys.filter(function (op) {
        var j = all[op];
        var destructive = (j.action === 'unsell' || j.action === 'deactivate');
        if (destructive && Date.now() - (j.at || 0) > JRN_SAFE_REPLAY_MS) { stale.push(j); jrnDone(op); return false; }
        return true;
      });
      // Текст про непереигранное снятие несём ДАЛЬШЕ [круг Фейбла 06.09.2026, LOW-1]: сам по себе
      // он тут же перекрывался следующим статусом «доделываю…» и человек его не видел.
      var staleNote = stale.length
        ? (' · ПРОВЕРЬТЕ вручную снятие: ' + stale.map(function (j) { return codeFromUid(j.uid); }).join(', '))
        : '';
      if (staleNote && !keys.length) {
        setStatus('bad', 'ПРОВЕРЬТЕ вручную: снятие так и не подтвердилось — '
                  + stale.map(function (j) { return codeFromUid(j.uid); }).join(', '));
      }
      if (!keys.length) return;
      setStatus(staleNote ? 'bad' : 'warn',
                'Страница перезагружалась — доделываю ' + keys.length + ' наклеек…' + staleNote);
      // ⚠️ ПО ОДНОЙ, А НЕ ВСЕ РАЗОМ [круг Кодекса 06.09.2026, HIGH-3]: двадцать записей давали
      // двадцать одновременных запросов, они дрались за общий замок, получали busy — и раньше
      // журнал объявлял их завершёнными. Здесь спешить некуда: это фон после перезагрузки,
      // работница уже сканирует дальше, и очередь из своих же запросов ей только мешает.
      var qi = 0;
      (function next() {
        if (qi >= keys.length) {
          var leftEnd = Object.keys(jrnRead()).length;
          setStatus((leftEnd || staleNote) ? (staleNote ? 'bad' : 'warn') : 'ok',
            (leftEnd ? ('Осталось доделать ' + leftEnd + ' — склад занят или нет связи, доделаю при следующем заходе')
                     : 'Всё недоделанное с прошлого раза записано ✓') + staleNote);
          return;
        }
        var op = keys[qi++];
        var j = all[op];
        var ex = {}; for (var k in j.extra) ex[k] = j.extra[k];
        ex.op = op;                          // ТОТ ЖЕ ключ: сервер отдаст исходный ответ, если уже сделал
        callGas(j.action, j.uid, function (data) {
          // ⚠️ «Склад занят», «нет ответа» и «наклейка ещё пишется» — ЭТО НЕ ИСХОД
          // [круг Фейбла MED-1 + круг Кодекса HIGH-3]. Раньше любой непустой ответ вычёркивал
          // запись, и экран говорил «всё записано» — неправда: при троих работницах занятый склад
          // дело обычное, а not_in_log обычные обработчики сами считают временным и повторяют.
          if (!data || data.error === 'busy' || data.error === 'not_in_log') { /* оставляем */ }
          else jrnDone(op);                  // содержательный исход (в т.ч. отказ) — второй раз не шлём
          setStatus(staleNote ? 'bad' : 'warn', 'Доделываю… осталось ' + (keys.length - qi) + staleNote);
          next();                            // следующая — только после ответа предыдущей
        }, ex);
      })();
    }

    var jsonpId = 0;
    function callGas(action, uid, onData, extra) {
      onData = onData || function () {};
      if (!GAS) { onData(null); return; }
      var cb = 'cb_' + (++jsonpId);
      var s = document.createElement('script');
      var done = false;
      // 25с > серверного ожидания блокировки (20с): медленный, но УСПЕШНЫЙ ответ
      // (когда параллельно идёт печать и держит локу) должен дойти, а не ложно
      // показать «нет связи», хотя единица уже активирована.
      var timer = setTimeout(function () { finish(null); }, 25000);
      function finish(data) {
        if (done) return; done = true;
        clearTimeout(timer);
        try { delete window[cb]; } catch (e) { window[cb] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
        onData(data);
      }
      window[cb] = function (data) { finish(data); };
      s.onerror = function () { finish(null); };
      var sep = GAS.indexOf('?') >= 0 ? '&' : '?';
      var qs = 'action=' + action + '&uid=' + encodeURIComponent(uid) + '&callback=' + cb;
      if (extra) for (var k in extra) qs += '&' + k + '=' + encodeURIComponent(extra[k]);   // no/src/nick/nums
      s.src = GAS + sep + qs;
      document.body.appendChild(s);
    }

    // Рамка-прицел меняет цвет (отклик): зелёный — поймали НОВЫЙ код, красный — уже сканировали.
    var _aimT = null;
    function setAim(cls) {
      if (!aim) return;
      aim.classList.remove('caught', 'dup', 'seen');
      if (cls) aim.classList.add(cls);
      if (_aimT) clearTimeout(_aimT);
      // «seen» держим дольше (до ответа сервера) — иначе рамка гасла и работник не понимал,
      // ждёт ли что-то ещё. Ответ перекрасит её сам.
      var hold = (cls === 'dup') ? 1500 : (cls === 'seen') ? 8000 : 600;
      _aimT = setTimeout(function () { aim.classList.remove('caught', 'dup', 'seen'); }, hold);
    }
    function flashAim()    { setAim('caught'); }   // новый код — зелёным
    function flashAimDup() { setAim('dup'); }      // уже сканировали — красным

    // Красная плашка поверх сканера (п.7), исчезает сама.
    var _toastT = null;
    function showScanToast(msg) {
      var t = document.getElementById('scan-toast');
      if (!t) return;
      t.textContent = msg || '';
      t.classList.add('show');
      if (_toastT) clearTimeout(_toastT);
      _toastT = setTimeout(function () { t.classList.remove('show'); }, 1600);
    }

    var lastScanAt = {};   // text → момент последнего чтения этого кода камерой
    var lastFreshAt = 0;   // момент последнего НОВОГО скана (любой режим) — гасит ложный «уже» у соседа
    var dupCand = { text: null, at: 0, warned: false };   // текущее «присутствие» уже-снятого кода в кадре
    function onScan(text) {
      var now = Date.now();
      var tDecode = perfNow();
      // Уже сканировали этот код. Красную «Уже отсканировали ранее» показываем ТОЛЬКО когда код
      // ОСОЗНАННО держат в кадре, и НЕ показываем (п.2а), если он лишь мелькнул, пока целятся в
      // соседнюю наклейку. Отличаем по ВРЕМЕНИ ПРИСУТСТВИЯ кода в кадре (а не по числу чтений —
      // оно зависит от fps декодера):
      //  • прошло <1.5с с любого НОВОГО скана → сосед случайно попал в кадр, молчим;
      //  • большой разрыв (>1.2с) с прошлым чтением = НОВОЕ появление кода → начинаем отсчёт, молчим;
      //  • код держат непрерывно ≥0.4с → осознанный повтор → красный ОДИН раз за наведение.
      if (seen[text]) {
        var prev = lastScanAt[text] || 0;
        lastScanAt[text] = now;
        if (now - lastFreshAt < 1500) { dupCand = { text: null, at: 0, warned: false }; return; }
        if (now - prev > 1200) { dupCand = { text: text, at: now, warned: false }; return; }
        if (dupCand.text === text && !dupCand.warned && now - dupCand.at >= 400) {
          dupCand.warned = true;
          flashAimDup(); showScanToast('Уже отсканировали ранее'); vibeDup();
          dlog('повтор', text, { res: 'уже сканировали' });
        }
        return;
      }
      lastScanAt[text] = now;
      lastFreshAt = now;                                // новый код → на 1.5с гасим ложное «уже» у соседей
      dupCand = { text: null, at: 0, warned: false };
      // ⚠️ НЕ красим рамку зелёным и НЕ даём «успешную» вибрацию до ответа сервера (HIGH-3):
      // только нейтральный «код считан». Зелёный ставит handleSellResult по исходу.
      if (MODE === 'order') { setAim('seen'); vibeSeen(); return onScanOrder(text, tDecode); }   // выдача — своя логика
      // ПРИЁМКА: рамку зелёным заранее НЕ красим (п.2б) — иначе у уже принятой наклейки мелькал бы
      // зелёный, а через мгновение красный. beep = «код пойман»; цвет рамки (зелёный/красный)
      // ставит renderScanCard по ответу сервера (теперь быстрому — без лишней записи для дубля).
      seen[text] = true;        // сбрасывается только кнопкой «Очистить»
      beep();
      total++;
      renderReceiptCount();

      var card = document.createElement('div');
      card.className = 'card loading';
      card.innerHTML =
        '<button class="del" type="button" aria-label="Удалить">✕</button>' +
        '<div class="thumbcol"><div class="thumb"><div class="ph">…</div></div>' +
        '<div class="unitno"></div></div>' +
        '<div class="meta"><div class="name">Записываю в таблицу…</div>' +
        '<div class="attr color"></div><div class="attr size"></div>' +
        '<div class="dupnote"></div></div>' +
        '<div class="counts"><span class="cbought"></span><span class="cscanned"></span></div>' +
        '<div class="labels"></div>';
      // номер из UnitID (последний сегмент) → короткий код наклейки «№ A001»
      card.querySelector('.unitno').textContent = '№ ' + seqToCode(String(text).split('-').pop());
      listEl.insertBefore(card, listEl.firstChild);
      // авто-очистка: в DOM держим максимум 50 карточек (самые старые удаляем) —
      // чтобы длинная сессия не грузила телефон. Полная история — в листе «Лог_сканов».
      while (listEl.children.length > 50) listEl.removeChild(listEl.lastChild);
      updateShowAll();

      // крестик — удалить карточку И снять отметку «принято» на складе.
      card._uid = text;
      card._activating = true;     // активация в полёте: deactivate отложим до ответа
      card._pendingDeact = false;
      card._fresh = false;         // true только если ИМЕННО этот скан учёл единицу (не дубль)
      card.querySelector('.del').addEventListener('click', function (e) {
        e.stopPropagation();                          // не запускать камеру / тап-вид
        // НЕблокирующее подтверждение — нативный confirm() морозит камеру на iOS.
        askConfirm('Удалить этот товар?', function () {   // пункт 7 — подтверждение
          if (card.parentNode) card.parentNode.removeChild(card);
          delete seen[text]; delete IN_FLIGHT[text];    // код снова можно отсканировать (и он больше не «в полёте»)
          total = Math.max(0, total - 1);
          if (card._fresh) accepted = Math.max(0, accepted - 1);
          if (card._rejected) rejected = Math.max(0, rejected - 1);
          renderReceiptCount();
          updateShowAll();
          // если activate ещё не вернулся — снимем ПОСЛЕ него (иначе deactivate может
          // обогнать activate, и единица останется активной при удалённой карточке).
          if (card._activating) card._pendingDeact = true;
          else if (card._fresh) sendDeactivate(text);  // снимать только то, что учёл ЭТОТ скан (дубль не трогаем)
        });
      });

      // тап по карточке → переключить вид: инфо (закуплено/отсканено) ↔ список наклеек
      card.addEventListener('click', function (e) {
        card.classList.toggle('show-labels');
        e.stopPropagation();   // не дёргать запуск камеры по тапу
      });

      // скан = «принял эту единицу»: активируем на складе и рисуем карточку
      var tSent = perfNow();
      card._op = newOpId('activate', text);        // повтор после таймаута идёт С ТЕМ ЖЕ op (HIGH-4)
      IN_FLIGHT[text] = true;
      jrnAdd('activate', text, { op: card._op });
      callGas('activate', text, function (data) {
        delete IN_FLIGHT[text];
        dlog('приёмка', text, {
          res: data ? (data.alreadyActive ? 'дубль' : data.counted ? 'принято' : (data.error || '?')) : 'нет связи',
          net: perfNow() - tSent, total: perfNow() - tDecode, srv: data && data.t, dbg: data && data.dbg });
        card._activating = false;
        if (card._pendingDeact) {                     // карточку уже сняли крестиком
          if (data && data.counted && !data.alreadyActive) sendDeactivate(text);  // снимаем только свежеучтённое
          return;
        }
        renderScanCard(card, data);
      }, { op: card._op });
    }

    // info = {bought, scanned, printed:[{code,scanned}]} — данные по товару+варианту.
    // Счётчики «закуп/скан»; цифра скан: меньше→красный, ровно→серый, больше→сиреневый.
    function renderCounts(card, info) {
      var bEl = card.querySelector('.cbought'), sEl = card.querySelector('.cscanned');
      if (!bEl || !sEl) return;
      if (info && (info.bought || info.bought === 0)) {
        var b = info.bought || 0, s = info.scanned || 0;
        bEl.textContent = 'закуп: ' + b;
        var col = (s < b) ? '#ff6b6b' : (s > b) ? '#c58af9' : '#9a9a9a';
        sEl.innerHTML = 'скан: <span style="color:' + col + '">' + s + '</span>';
      } else { bEl.textContent = ''; sEl.textContent = ''; }
    }
    // тап-вид: заголовок (отсканенные зелёным / неотсканенные красным); список — с новой
    // строки, отсканированные коды зелёным, неотсканированные — красным.
    function renderLabels(card, info) {
      var lEl = card.querySelector('.labels');
      if (!lEl) return;
      var arr = (info && info.printed) || [];
      if (!arr.length) { lEl.innerHTML = ''; return; }
      var parts = arr.map(function (p) {
        return '<span class="' + (p.scanned ? 'done' : 'undone') + '">' + esc(p.code) + '</span>';
      }).join(', ');
      lEl.innerHTML = '<span class="lt">Распечатанные наклейки '
        + '(<span class="done">отсканенные</span>/<span class="undone">неотсканенные</span>):</span>'
        + '<br>' + parts;
    }
    // Фон по цвету-размеру: каждому новому ключу (товар+вариант) — следующий из 10
    // оттенков по кругу (чередование по порядку появления → соседние гарантированно разные).
    var _bgShades = {}, _bgNext = 0;
    function shadeFor(key) {
      if (!(key in _bgShades)) { _bgShades[key] = _bgNext % 10; _bgNext++; }
      return _bgShades[key];
    }
    // Синхронно обновить счётчики/список + фон во ВСЕХ видимых карточках этого
    // товара+варианта (одного типа) — чтобы при каждом скане/снятии инфа совпадала.
    function applyVariantInfo(num, variant, info) {
      if (num == null) return;
      var bg   = 'bg' + shadeFor(num + '|' + variant);
      var full = !!(info && info.bought > 0 && info.scanned === info.bought);  // всё принято → зелёный фон
      var cards = listEl.children;
      for (var i = 0; i < cards.length; i++) {
        var c = cards[i];
        if (c._num === num && c._variant === variant) {
          c._info = info; renderCounts(c, info); renderLabels(c, info);
          c.classList.add(bg);                 // оттенок по цвету-размеру (идемпотентно)
          c.classList.toggle('full', full);    // зелёный, когда скан == закуп
        }
      }
    }

    // Снять активацию с проверкой ответа: при сбое (нет связи / склад занят /
    // нет в журнале) НЕ молчим — предупреждаем, чтобы отметка не осталась висеть.
    function sendDeactivate(uid) {
      // Транспортные сбои повторяем сами [ревью Кодекса «живучесть», HIGH]: карточку работница уже
      // убрала с экрана, и молча оставить отметку «принято» висеть нельзя.
      callGasRetry('deactivate', uid, {}, function (data) {
        delete IN_FLIGHT[uid];
        if (!data || !data.ok) {
          showErr(data && data.error === 'issued'
            ? ('Снять приёмку нельзя: вещь уже выдана по заказу ' + (data.orderNo || '') +
               '. Сначала снимите выдачу в заказе.')                       // MED-4
            : (data && data.commitUncertain
               ? 'Таблица НЕ подтвердила снятие — проверьте её и повторите.'   // MED-1
               : 'Не удалось снять отметку даже с трёх попыток (нет связи / склад занят). ' +
                 'Отсканируйте её заново и снимите ещё раз.'));
          return;
        }
        // после снятия — обновить счётчики/список во всех карточках этого типа
        applyVariantInfo(data.num, data.variant,
          { bought: data.bought, scanned: data.scanned, printed: data.printed });
      });
    }

    // Карточка по ответу activate. Зелёная — ТОЛЬКО когда реально учтено (counted).
    // Транзиентные сбои (склад занят / нет связи / наклейка ещё не дописалась в
    // журнал после печати) → жёлтая + ТИХИЙ авто-повтор той же карточки (без новой
    // карточки и без накрутки «Отсканировано» — seen НЕ трогаем). Реально «не найдено»
    // или «позиции нет на складе» → красная, без повтора.
    function renderScanCard(card, data) {
      // Определённый исход по этой наклейке — из журнала смены её убираем (транзиентные сбои
      // ниже сами поставят повтор и оставят запись).
      if (data && data.error !== 'busy' && data.error !== 'not_in_log') jrnDone(card._op);
      var wasFresh = !!card._fresh, wasRejected = !!card._rejected;
      card._fresh = !!(data && data.counted && !data.alreadyActive);   // ИМЕННО этот скан учёл (не дубль)
      // «Принято» считаем ТОЛЬКО по подтверждённому новому переходу (LOW-1); всё остальное —
      // в «не принято», чтобы работник видел реальный недобор коробки.
      // «Не принято» — ЛЮБОЙ исход, кроме нового учтённого приёма и дубля: включая «нет связи»
      // (data == null) [круг Кодекса 06.09.2026, LOW-10]. Дубль (alreadyActive) — отдельный случай:
      // вещь в таблице есть, недобора коробки он не означает, поэтому в «не принято» не идёт.
      card._rejected = !card._fresh && !(data && data.alreadyActive);
      if (card._fresh && !wasFresh) accepted++;
      if (!card._fresh && wasFresh) accepted = Math.max(0, accepted - 1);
      if (card._rejected && !wasRejected) rejected++;
      if (!card._rejected && wasRejected) rejected = Math.max(0, rejected - 1);
      renderReceiptCount();
      var thumb   = card.querySelector('.thumb');
      var nameEl  = card.querySelector('.name');
      var colorEl = card.querySelector('.color');
      var sizeEl  = card.querySelector('.size');
      var dupEl   = card.querySelector('.dupnote');
      if (dupEl) dupEl.textContent = '';
      // название с номером впереди: «17 | костюм»
      function nm() {
        var base = (data && (data.nameRu || data.name)) || '';
        if (!base) return '№ ' + ((data && data.num) || '');
        return (data && data.num ? data.num + ' | ' : '') + base;
      }
      function fillItem() {
        // имя + цена в одну строку: «1 | костюм   33€» (цена тем же шрифтом, светло-серым)
        var price = (data && (data.price || data.price === 0))
          ? String(data.price).replace(/\s+/g, '') : '';
        nameEl.innerHTML = '<span class="nm-text">' + esc(nm()) + '</span>'
          + (price ? '<span class="pr">   ' + esc(price) + '</span>' : '');
        var cs = splitVariant(data.variant);
        colorEl.innerHTML = cs.color ? ('цвет: <span class="val">' + esc(cs.color) + '</span>') : '';
        sizeEl.innerHTML  = cs.size  ? ('размер: <span class="val">' + esc(cs.size) + '</span>') : '';
        if (data.photoUrl) {
          var img = document.createElement('img');
          img.alt = '';
          img.onerror = function () { thumb.innerHTML = '<div class="ph">📦</div>'; };
          img.src = data.photoUrl;
          thumb.innerHTML = ''; thumb.appendChild(img);
        } else { thumb.innerHTML = '<div class="ph">📦</div>'; }
      }
      // учтено → зелёная. Но если эта единица УЖЕ была пропикана ранее (дубль) —
      // красная полоса + красная подпись «товар уже есть в таблице».
      if (data && data.counted) {
        fillItem();
        card._num = data.num; card._variant = data.variant;
        // СНАЧАЛА класс состояния (он сбрасывает className), ПОТОМ фон/счётчики
        card.className = data.alreadyActive ? 'card dup' : 'card ok';
        if (data.alreadyActive) {
          if (dupEl) dupEl.textContent = 'товар уже есть в таблице';
          // уже принимали эту наклейку раньше (в т.ч. в прошлой сессии) — красная рамка + плашка
          // + двойная вибрация (п.2), как и при выдаче.
          flashAimDup(); showScanToast('Уже отсканировали ранее'); vibeDup();
        } else {
          flashAim(); vibeOk();   // подтверждённый НОВЫЙ приём → зелёная рамка ПОСЛЕ ответа (п.2б), не оптимистично
        }
        // обновить счётчики/список/фон в ЭТОЙ карточке и во всех карточках того же типа
        applyVariantInfo(data.num, data.variant,
          { bought: data.bought, scanned: data.scanned, printed: data.printed });
        return;
      }

      // транзиентные сбои → жёлтая + повтор
      card._lastErr = data && data.error ? data.error : (data ? '' : 'no_net');
      var notFlushed = data && data.error === 'not_in_log';   // карточку покажем, даже если каталог молчит
      var isBusy     = data && data.error === 'busy';
      var noConn     = !data;
      if (notFlushed || isBusy || noConn) {
        card.className = 'card warn';
        if (data && (data.found || data.name)) fillItem();
        if (isBusy)        { thumb.innerHTML = '<div class="ph">⏳</div>'; nameEl.textContent = 'Склад занят — повтор…'; }
        else if (noConn)   { thumb.innerHTML = '<div class="ph">⚠️</div>'; nameEl.textContent = 'Нет связи — повтор…'; }
        else               { nameEl.textContent = nm() + ' — учитываю, повтор…'; }
        scheduleRetry(card);
        return;
      }

      // постоянные ошибки → красная, без повтора
      card.className = 'card bad';
      if (data && data.commitUncertain) {
        // Таблица не подтвердила запись [MED-1] — врать «принято» нельзя, просим проверить.
        if (data.name) fillItem();
        nameEl.textContent = nm() + ' — таблица НЕ подтвердила запись, проверьте и отсканируйте заново';
      } else if (data && data.error === 'dup_num') {
        // В каталоге две строки с одним № [CRIT-2] — какая это вещь, аппка не знает.
        thumb.innerHTML = '<div class="ph">⚠️</div>';
        nameEl.textContent = 'В каталоге ДВЕ строки с № ' + ((data && data.num) || '') +
          ((data.dupNames && data.dupNames.length) ? ' (' + data.dupNames.join(' / ') + ')' : '') +
          ' — поменяйте номер у одной и перепечатайте наклейки';
      } else if (data && data.error === 'issued') {
        // Крестик по уже выданной вещи [MED-4].
        if (data.name) fillItem();
        nameEl.textContent = nm() + ' — уже выдана по заказу ' + (data.orderNo || '') +
          '. Сначала снимите выдачу в заказе.';
      } else if (data && data.error === 'item_missing') {
        if (data.name) fillItem();
        nameEl.textContent = nm() + ' — позиции нет на складе';
      } else {
        thumb.innerHTML = '<div class="ph">❓</div>';
        nameEl.textContent = 'Не найдено на складе';
      }
    }

    // Тихий повтор activate для ТОЙ ЖЕ карточки (без новой карточки и без total++).
    // Лечит транзиентные сбои (печать держит локу, моргнула связь, лог не дописался)
    // не плодя дубли. До 4 попыток с паузой 2с, потом оставляем жёлтую с подсказкой.
    function scheduleRetry(card) {
      if (!card._uid) return;
      IN_FLIGHT[card._uid] = true;              // исход по этой наклейке ещё не определён (MED-7)
      card._retries = (card._retries || 0) + 1;
      if (card._retries > 4) {
        var n = card.querySelector('.name');
        delete IN_FLIGHT[card._uid];
        if (!card._rejected) { card._rejected = true; rejected++; renderReceiptCount(); }   // LOW-10
        // ⚠️ «Наклейки нет в журнале печати» после пяти попыток — это НЕ связь, это потерянная
        // регистрация тиража [ревью Кодекса «живучесть», HIGH]. Наклейка у работницы в руках, и
        // это доказательство: даём кнопку дописать её в журнал и принять.
        if (card._lastErr === 'not_in_log') {
          if (n) n.textContent = 'Этой наклейки нет в журнале печати — тираж не записался';
          showFixButton(card);
        } else if (n) {
          n.textContent = 'Не удалось учесть — нажмите ✕ и отсканируйте заново';
        }
        return;
      }
      setTimeout(function () {
        if (!card.parentNode) { delete IN_FLIGHT[card._uid]; return; }   // карточку убрали крестиком (LOW-3)
        card._activating = true;
        if (!card._op) card._op = newOpId('activate', card._uid);   // тот же op на все попытки (HIGH-4)
        callGas('activate', card._uid, function (data) {
          delete IN_FLIGHT[card._uid];            // ответ пришёл [ревью Кодекса «живучесть», MED]:
          card._activating = false;               // раньше флаг оставался, и «назад» ложно предупреждал
          if (card._pendingDeact) { if (data && data.counted && !data.alreadyActive) sendDeactivate(card._uid); return; }
          renderScanCard(card, data);
        }, { op: card._op });
      }, 2000);
    }

    // Кнопка «Записать в журнал» на карточке, у которой тираж потерялся. Сервер разберёт UnitID
    // по каталогу и допишет ту самую строку, которую записала бы печать; всё неоднозначное он
    // отвергнет сам (неизвестный номер, дубль номера, нераспознанный вариант).
    function showFixButton(card) {
      if (!card || card.querySelector('.fixbtn')) return;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'fixbtn';
      b.textContent = 'Записать в журнал и принять';
      b.style.cssText = 'margin-top:8px;padding:10px 14px;border:0;border-radius:10px;'
        + 'background:#0b8043;color:#fff;font:700 15px inherit;cursor:pointer';
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        b.disabled = true; b.textContent = 'Записываю…';
        callGas('register_lost', card._uid, function (data) {
          if (!data || !data.ok) {
            b.disabled = false; b.textContent = 'Записать в журнал и принять';
            // ⚠️ Словарь обязан знать ВСЕ отказы сервера [круг Фейбла 06.09.2026, MED-1]: после
            // переписывания дозаписи здесь остались старые коды, а новые уходили на телефон как
            // «ambiguous_src» — работница такого не понимает и звонит владельцу.
            var why = !data ? 'нет связи'
              : data.error === 'ambiguous_src'
                  ? ('такая же наклейка есть сразу в нескольких закупках ('
                     + ((data.srcIds || []).length || 2) + ') — аппка не знает, чья это вещь. '
                     + 'Перепечатайте наклейку из нужной закупки')
              : data.error === 'unknown_label'
                  ? 'по этому коду в каталогах нет такого товара с таким цветом/размером — '
                    + 'возможно, строку каталога переименовали. Перепечатайте наклейку'
              : data.error === 'seq_not_issued'
                  ? 'номер этой наклейки ещё не выдавался — код не наш или счётчик наклеек сбрасывали'
              : data.error === 'code_taken'
                  ? 'этот короткий код уже стоит за другой наклейкой — перепечатайте'
              : (data.error === 'bad_uid' || data.error === 'no_uid')
                  ? 'код наклейки прочитан неверно — отсканируйте ещё раз'
              : data.error === 'busy' ? 'склад занят — нажмите ещё раз через секунду'
              : data.commitUncertain ? 'таблица не подтвердила запись — проверьте её'
              : (data.error || 'сбой');
            showErr('Не удалось дописать наклейку: ' + why + '.');
            return;
          }
          // Строка появилась — принимаем вещь обычным путём, с новым ключом операции.
          b.remove();
          card.className = 'card loading';
          card._retries = 0; card._op = newOpId('activate', card._uid);
          IN_FLIGHT[card._uid] = true;
          jrnAdd('activate', card._uid, { op: card._op });
          callGas('activate', card._uid, function (d2) {
            delete IN_FLIGHT[card._uid];
            renderScanCard(card, d2);
          }, { op: card._op });
        });
      });
      var meta = card.querySelector('.meta') || card;
      meta.appendChild(b);
    }

    // Разбить вариант («beige» / «beige XL» / «blue M») на цвет и размер.
    // Размер — токены S/M/L/XL… или число; всё остальное считаем цветом.
    // размер целиком в скобках («(koza)») — снимаем скобки, берём содержимое
    function cleanSize(s) {
      s = String(s || '').trim();
      var m = s.match(/^\((.+)\)$/);
      return m ? m[1].trim() : s;
    }
    function splitVariant(v) {
      v = (v || '').trim();
      if (!v) return { color: '', size: '' };
      // «milk (koza)» → цвет «milk», размер «koza» (размер в скобках в конце)
      var par = v.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
      if (par) return { color: par[1].trim(), size: par[2].trim() };
      var tokens = v.split(/[\s,\/]+/).filter(Boolean);
      var sizeRe = /^(xxxs|xxs|xs|s|m|l|xl|xxl|xxxl|\d{1,3})$/i;
      var colors = [], sizes = [];
      for (var i = 0; i < tokens.length; i++) {
        if (sizeRe.test(tokens[i])) sizes.push(tokens[i].toUpperCase());
        else colors.push(tokens[i]);
      }
      return { color: colors.join(' '), size: sizes.join(' ') };
    }

    // Цвет и размер — на ОТДЕЛЬНЫХ строках (размер ПОД цветом). opt.hlColor/hlSize —
    // жёлтое выделение различия; opt.emptySize — показать «размер: без размера», если размера нет.
    function csLinesHtml(color, size, opt) {
      opt = opt || {};
      var out = '';
      if (color) out += '<div class="cs-row' + (opt.hlColor ? ' hl' : '') + '">цвет: <span class="val">' + esc(color) + '</span></div>';
      if (size)  out += '<div class="cs-row' + (opt.hlSize ? ' hl' : '') + '">размер: <span class="val">' + esc(size) + '</span></div>';
      else if (opt.emptySize) out += '<div class="cs-row' + (opt.hlSize ? ' hl' : '') + '">размер: <span class="val">без размера</span></div>';
      return out;
    }

    // slugify — как на сервере/в апке (makeUnitId): сопоставление варианта скана с заказом.
    function slugify(s) {
      return String(s || '').toLowerCase()
        .replace(/[\s\/|]+/g, '_')
        .replace(/[^a-z0-9_\-À-ɏЀ-ӿ]/g, '')
        .replace(/_+/g, '_')
        .replace(/^[_\-]+|[_\-]+$/g, '');
    }

    // ════════════════════ Режим «Собрать заказ» ════════════════════
    var ORDER = null;             // выгрузка заказа с сервера
    var BADGE_BY_SLOT = {};       // "num|slug" → [бейджи] (только НЕ-net позиции — цель скана)
    var statusTimer = null;
    var RETRY = {};               // uid → счётчик тихих повторов выдачи (без нижней ленты)
    var RETRY_T = {};             // uid → handle отложенного повтора (для отмены устаревших)
    var SLOT_REV = {};            // slot → ревизия последнего ПРИМЕНЁННОГО ответа (см. applyRev)
    var RESOLVED_NO = '';         // № заказа, который РАЗРЕШИЛ сервер (только для снятия выдачи)
    var IN_FLIGHT = {};           // uid → true, пока запрос по нему в сети (приёмка/выдача/привязка/снятие)
    var PENDING_ASSIGN = {};      // uid → true, пока привязка не подтверждена сервером

    // Ключ слота — ПОБУКВЕННО как на сервере (skladSlotKey_ в sklad-log.gs)
    // [ревью Кодекса 06.09.2026, LOW-2]: раньше клиент клеил num+'|'+slug без экранирования, и у
    // номера с «|» или «\» стартовые «уже выдано» не приклеивались к бейджикам.
    function slotKeyEsc(x) {
      return String(x == null ? '' : x).replace(/\\/g, '\\\\').replace(/\|/g, '\\|');
    }
    function slotKey(num, slug) { return slotKeyEsc(num) + '|' + String(slug == null ? '' : slug); }

    // Ревизия ответа [ревью Кодекса 06.09.2026, MED-3]: сервер ставит её ПОД ЗАМКОМ, поэтому у
    // более позднего скана она больше. Ответ, обогнавший более свежий, к бейджикам не применяем —
    // иначе экран откатывал цифру назад и работник сканировал лишнюю вещь.
    function applyRev(slot, rev) {
      if (!slot) return true;
      var r = Number(rev || 0);
      if (!r) return true;                       // старый сервер без ревизии — ведём себя как раньше
      if ((SLOT_REV[slot] || 0) > r) return false;
      SLOT_REV[slot] = r;
      return true;
    }

    // opId операции [ревью Кодекса 06.09.2026, HIGH-4]: повтор ТОГО ЖЕ opId после таймаута отдаёт
    // исходный ответ сервера и не пишет второй раз. Один opId живёт на все попытки одной операции.
    var _opSeq = 0;
    function newOpId(kind, uid) {
      return kind + '.' + (++_opSeq) + '.' + Date.now().toString(36) + '.' + String(uid || '').slice(-8);
    }

    function initOrderMode() {
      document.body.classList.add('order-mode');
      reloadOrder();
      // Держим серверный кэш состава заказа ТЁПЛЫМ: тогда скан выдачи не открывает таблицу-источник
      // по ID (это и давало ~5с до попапа расхождения). Фоновый пинг каждые 45с (TTL кэша 60с),
      // результат игнорируем — НЕ перерисовываем бейджики (иначе сбили бы оптимистичные состояния).
      setInterval(function () {
        callGas('order_lookup', '', function () {}, { no: ORDER_NO, src: SRC, nick: ORDER_NICK, fresh: 1, warm: 1 });
      }, 45000);
    }
    // подгрузка/перечитка заказа (uid не нужен — order_lookup читает src/no/nick).
    // Зовём при старте и после ручной привязки/снятия выдачи — бейджики и коды
    // наклеек берутся из АВТОРИТЕТНОГО состояния сервера (givenBySlot/uidsBySlot).
    var _reloadTries = 0;
    function reloadOrder() {
      var t0 = perfNow();
      callGas('order_lookup', '', function (o) {
        dlog('заказ загружен', '', {
          res: (o && o.found) ? (((o.items || []).length) + ' поз.') : (o ? 'не найден' : 'нет ответа'),
          net: perfNow() - t0, srv: o && o.t });
        // ⚠️ НЕТ ОТВЕТА — ЭТО НЕ «ЗАКАЗ НЕ НАЙДЕН» [ревью Кодекса «живучесть» 06.09.2026, MED].
        // Раньше оба случая рисовали один экран, и работница шла проверять номер, хотя дело было
        // в связи. Уже показанный заказ НЕ стираем — он верен, просто не обновился.
        if (!o) {
          if (_reloadTries < 3) {
            _reloadTries++;
            setStatus('warn', 'Нет ответа склада — пробую ещё раз (' + _reloadTries + ' из 3)…');
            setTimeout(reloadOrder, 1500 * _reloadTries);
            return;
          }
          setStatus('bad', 'Склад не отвечает. Заказ показан на момент последней загрузки — обновите позже.');
          if (!ORDER || !ORDER.found) {
            document.getElementById('order-grid').innerHTML =
              '<div class="ord-empty">Нет ответа склада.<br>Это НЕ значит, что заказа нет —'
              + '<br>проверьте связь и потяните страницу заново.</div>';
          }
          return;
        }
        _reloadTries = 0;
        renderOrderBadges(o);
      }, { no: ORDER_NO, src: SRC, nick: ORDER_NICK, fresh: 1 });   // fresh=1 — состав читаем СВЕЖИМ из листа (владелец мог поправить размер/цвет)
    }

    function renderOrderBadges(order) {
      ORDER = order || { found: false, items: [] };
      BADGE_BY_SLOT = {};
      SLOT_REV = {};                            // новый состав — прежние ревизии слотов недействительны
      _orderInitDone = false;                   // стартовая отрисовка: не показывать попап «собран»
      // Номер, который РАЗРЕШИЛ сервер [HIGH-6]. Нужен ТОЛЬКО крестику «снять выдачу»: страница,
      // открытая по нику, слала пустой no, и серверная сверка «та ли это выдача» молча
      // выключалась — старая вкладка могла стереть ЧУЖУЮ актуальную выдачу.
      // ⚠️ ГЛОБАЛЬНЫЙ ORDER_NO НЕ ТРОГАЕМ [круг Фейбла 06.09.2026, HIGH-1]: заменив его, мы
      // перевели бы ВСЕ запросы страницы с ключа «ник» на ключ «номер» — промах прогретого кэша
      // состава (+2–4 с на первом скане) и, хуже, потеря строк БЕЗ номера, которые поиск по нику
      // присоединяет, а поиск по номеру — нет: бейджик нарисован, а выдать вещь нельзя.
      RESOLVED_NO = ORDER.orderNo ? String(ORDER.orderNo) : '';
      var noTxt = ORDER.orderNo || ORDER_NO || '';
      var nickTxt = ORDER.nick || ORDER_NICK || '';
      document.getElementById('order-title').textContent = '🧺 Заказ ' + noTxt + (nickTxt ? ' · ' + nickTxt : '');
      var grid = document.getElementById('order-grid');
      var items = ORDER.items || [];
      if (!ORDER.found || !items.length) {
        // Один № стоит у РАЗНЫХ клиентов (сервер не отдаёт такой заказ — иначе товар уйдёт не тому).
        if (ORDER.error === 'mixed_clients') {
          var mx = (ORDER.mixedNicks || []).map(esc).join(' / ');   // esc: ник из кол.C может содержать < &
          grid.innerHTML = '<div class="ord-empty">⚠️ Этот номер стоит у РАЗНЫХ клиентов'
            + (mx ? ' (' + mx + ')' : '') + '.<br>Заказ не открыт — иначе товар уйдёт не тому.'
            + '<br>Если это РАЗНЫЕ клиенты — исправьте № в таблице «Заказы».'
            + '<br>Если это ОДИН клиент — запишите ник одинаково в колонке C.</div>';
          updateOrderProgress();
          return;
        }
        // У одного ника несколько незакрытых заказов — сервер не смешивает их (HIGH-2).
        if (ORDER.error === 'mixed_orders') {
          var mn = (ORDER.mixedNos || []).map(esc).join(' / ');
          grid.innerHTML = '<div class="ord-empty">⚠️ У этого клиента сейчас несколько заказов'
            + (mn ? ' (' + mn + ')' : '') + '.<br>По нику открывать нельзя — вещь запишется не в тот заказ.'
            + '<br>Откройте нужный заказ ПО НОМЕРУ.</div>';
          updateOrderProgress();
          return;
        }
        if (ORDER.error === 'all_closed') {
          grid.innerHTML = '<div class="ord-empty">У этого клиента нет незакрытых заказов —'
            + '<br>все его заказы уже выставлены в инвойс.</div>';
          updateOrderProgress();
          return;
        }
        var why = (ORDER.error === 'no_orders_sheet') ? 'в таблице нет листа «Заказы».'
                : (ORDER.error === 'src_open_failed') ? 'не удалось открыть таблицу-источник.'
                : 'проверьте номер/ник и таблицу.';
        grid.innerHTML = '<div class="ord-empty">Заказ не найден — ' + why + '</div>';
        updateOrderProgress();
        return;
      }
      // ПО ОДНОМУ бейджику на КАЖДУЮ позицию заказа: две одинаковых вещи → два бейджика
      grid.innerHTML = items.map(function (it, i) {
        var color = it.color || splitVariant(it.variant).color || '';
        var size  = cleanSize(it.size) || splitVariant(it.variant).size || '';
        var nm = it.nameRu || it.name || '';
        var attr = csLinesHtml(color, size, {});   // размер ПОД цветом (отдельные строки)
        return '<div class="obadge" data-idx="' + i + '" data-num="' + esc(it.num) + '" data-net="' + (it.hasNet ? 1 : 0) + '">'
          + '<button type="button" class="obadge-del" aria-label="Снять выдачу">✕</button>'
          + '<div class="othumb"><div class="ph">📦</div></div>'
          + '<div class="ometa"><div class="oname">' + esc(it.num) + ' | ' + esc(nm) + '</div>'
          +   '<div class="oattr">' + attr + '</div></div>'
          + '<div class="ochip"></div></div>';
      }).join('');
      // карта слот → СПИСОК бейджиков (только НЕ-net — это цели скана)
      items.forEach(function (it, i) {
        var el = grid.querySelector('.obadge[data-idx="' + i + '"]');
        if (!el) return;
        el._item = it;
        // тап по телу бейджика НЕ снимает выдачу (п.4) — только не даём запустить камеру.
        // Снятие выдачи — лишь по крестику ✕ в углу (виден на зелёных «выдано» бейджиках).
        el.addEventListener('click', function (e) { e.stopPropagation(); });
        var del = el.querySelector('.obadge-del');
        if (del) del.addEventListener('click', function (e) { e.stopPropagation(); onBadgeTap(el); });
        if (it.hasNet) { setBadgeNet(el); return; }
        var slot = slotKey(it.num, it.slug);
        (BADGE_BY_SLOT[slot] || (BADGE_BY_SLOT[slot] = [])).push(el);
        setBadgePending(el);
      });
      // стартовое «уже выдано» по слотам (с сервера): гасим N бейджиков каждого слота,
      // под галкой — код наклейки из uidsBySlot (тап по бейджику снимет именно её выдачу).
      var gbs = ORDER.givenBySlot || {};
      var ubs = ORDER.uidsBySlot || {};
      Object.keys(gbs).forEach(function (slot) { markSlotGiven(slot, gbs[slot], ubs[slot]); });
      updateOrderProgress();                    // зафиксирует _orderComplete по стартовому состоянию
      _orderInitDone = true;                    // дальше добор до полного во время скана → попап «собран»
      _donePopupShown = _orderComplete;         // уже собран при открытии → попап «собран» не всплывёт
      fetchOrderPhotos(items);
    }

    // Один бейджик = одна позиция: «ждёт» / «✓ + код наклейки» / «не хватило».
    function codeFromUid(uid) { return seqToCode(String(uid || '').split('-').pop()); }
    function setBadgePending(el) {
      if (!el) return;
      el.classList.remove('done', 'part', 'net', 'saving');
      el.setAttribute('data-net', '0'); el.setAttribute('data-done', '0');
      el._uid = '';
      el.querySelector('.ochip').innerHTML = '<span class="ostate">ждёт</span>';
    }
    // uid — наклейка, закрывшая бейджик: под галкой пишем её код (AA001), запоминаем для отмены.
    function setBadgeDone(el, uid) {
      if (!el) return;
      el.classList.remove('part', 'net', 'saving'); el.classList.add('done');
      el.setAttribute('data-done', '1');
      if (uid) el._uid = uid;
      var code = el._uid ? codeFromUid(el._uid) : '';
      el.querySelector('.ochip').innerHTML =
