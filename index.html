        '<span class="ostate" style="color:#7ee2a0;font-size:20px">✓</span>'
        + (code ? '<span class="ocode">' + esc(code) + '</span>' : '');
    }
    // «Сохраняю…» — позиция уже занята этой наклейкой (прогресс её считает), но сервер ещё не
    // подтвердил. Отличается от зелёной галки видом, чтобы работница не приняла её за готовое.
    function setBadgeSaving(el, uid) {
      if (!el) return;
      el.classList.remove('part', 'net'); el.classList.add('done', 'saving');
      el.setAttribute('data-done', '1');
      if (uid) el._uid = uid;
      el.querySelector('.ochip').innerHTML = '<span class="ostate" style="color:#f0c040">Сохраняю…</span>';
    }
    function setBadgeNet(el) {
      if (!el) return;
      el.classList.remove('done', 'part'); el.classList.add('net');
      el.setAttribute('data-net', '1'); el.setAttribute('data-done', '0');
      el.querySelector('.ochip').innerHTML = '<span class="ostate">не хватило</span>';
    }
    // погасить первые k бейджиков слота как «выдано» (с кодами из uids), остальные — «ждёт»
    function markSlotGiven(slot, k, uids) {
      var arr = BADGE_BY_SLOT[slot] || [];
      uids = uids || [];
      for (var i = 0; i < arr.length; i++) {
        if (i < k) setBadgeDone(arr[i], uids[i]); else setBadgePending(arr[i]);
      }
    }
    // крестик ✕ на закрытом (зелёном) бейджике = снять его выдачу (п.4: только по ✕, не по телу)
    function onBadgeTap(el) {
      if (!el || el.getAttribute('data-done') !== '1') return;
      if (!el._uid) { setStatus('warn', 'Не знаю код этой выдачи — обновите заказ.'); return; }
      var uid = el._uid;
      askConfirm('Снять выдачу этой вещи?', function () { sendUnsell(uid, el); });   // НЕблокирующее — confirm() морозит камеру на iOS
    }

    // Обновить бейджи слота по ответу сервера (given — авторитетное число с сервера).
    // Только что закрытому бейджику отдаём uid этого скана (для кода/отмены); прежние — свой.
    function updateOrderBadge(data, flash) {
      if (!data || !data.num) return;
      // Слот кредита: при ручной привязке это ВЫБРАННАЯ позиция, иначе слот самой наклейки.
      var slot = data.assignSlot || slotKey(data.num, slugify(data.variant));
      // Ответ, обогнавший более свежий, не применяем — иначе бейджики откатились бы назад (MED-3).
      if (!applyRev(slot, data.rev)) return;
      var arr = BADGE_BY_SLOT[slot];
      // слота нет в текущей раскладке → бейджики построены по УСТАРЕВШЕМУ составу (заказ
      // поправили между открытием и сканом). Перечитываем свежим — бейджики перестроятся
      // и зажгут уже выданное по givenBySlot с сервера.
      if (!arr || !arr.length) { reloadOrder(); return; }
      var given = Math.max(0, Math.min(data.given != null ? data.given : 0, arr.length));
      for (var i = 0; i < arr.length; i++) {
        if (i < given) setBadgeDone(arr[i], (flash && i === given - 1) ? data.uid : undefined);
        else setBadgePending(arr[i]);
      }
      if (flash && given > 0) {
        var el = arr[given - 1];          // бейджик, который только что закрыли
        el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
        try { el.scrollIntoView({ block: 'nearest' }); } catch (e) {}
      }
      updateOrderProgress();
    }

    // _orderComplete — текущая собранность; _orderInitDone — закончилась ли стартовая отрисовка;
    // _donePopupShown — показан ли попап «Заказ собран» для ТЕКУЩЕГО завершения (чтобы не дублить и
    // не всплывать при открытии уже собранного заказа).
    // _doneAwaitAssign — попап «собран» показан ОПТИМИСТИЧНО при ручной привязке и ещё НЕ подтверждён
    // сервером (тогда «Закрыть» в меню должна подождать подтверждения, иначе при отказе уйдём с
    // ложным «собран»); _leaveAfterAssign — работник нажал «Закрыть», пока привязка не подтверждена.
    var _orderComplete = false, _orderInitDone = false, _donePopupShown = false;
    var _doneAwaitAssign = false, _leaveAfterAssign = false;
    // «Закрыть»/«Назад»: если по каким-то наклейкам ещё нет определённого ответа — предупреждаем
    // [ревью Кодекса 06.09.2026, CRIT-1]. Общего гашения повторов больше нет, поэтому единственная
    // точка, где незавершённое может потеряться, — уход со страницы. Молча уйти нельзя.
    function warnIfPending(onGo) {
      var n = pendingCount();
      if (!n) { onGo(); return; }
      askConfirm('Ещё не подтверждено наклеек: ' + n + '. Уйти всё равно?', onGo);
    }
    // «Закрыть» в попапе «Заказ собран»: уходим в меню только когда привязка подтверждена сервером.
    function closeOrderDone() {
      if (_doneAwaitAssign || Object.keys(PENDING_ASSIGN).length) {   // привязки ещё в полёте — ждём (HIGH-5)
        _leaveAfterAssign = true;
        var b = document.querySelector('#order-done-popup .odone-close');
        if (b) { b.textContent = 'Сохраняю…'; b.disabled = true; }
        return;
      }
      warnIfPending(leaveToWarehouse);
    }
    function mpopOpen() { var p = document.getElementById('mismatch-popup'); return !!(p && p.style.display !== 'none'); }
    // Попап «собран» показываем, только когда ничто его не перекроет: нет открытого попапа
    // расхождения и очередь расхождений пуста.
    function canShowDone() { return !mpopOpen() && !MQUEUE.length; }
    function updateOrderProgress() {
      var pe = document.getElementById('order-progress');
      if (!ORDER) { pe.textContent = ''; return; }
      var need = 0, given = 0;
      Array.prototype.forEach.call(document.querySelectorAll('#order-grid .obadge'), function (el) {
        if (el.getAttribute('data-net') === '1') return;
        need++;
        if (el.getAttribute('data-done') === '1') given++;
      });
      var sum = (ORDER.totalSum != null) ? ORDER.totalSum : 0;
      var cnt = (ORDER.totalCount != null) ? ORDER.totalCount : need;
      var net = ORDER.netCount || 0;
      var complete = need > 0 && given >= need;
      if (complete) {
        pe.textContent = '✅ Заказ собран · ' + cnt + ' поз. · ' + sum + ' €' + (net ? ' · ' + net + ' не хватило' : '');
        pe.classList.add('done');
      } else {
        pe.textContent = 'Выдано ' + given + ' из ' + need + ' · ' + cnt + ' поз. · ' + sum + ' €'
                       + (net ? ' · ' + net + ' не хватило' : '');
        pe.classList.remove('done');
      }
      // заказ добран до полного во время сканирования → большой попап «собран» (п.8). Показываем
      // РОВНО раз за завершение и только когда ничто его не перекроет (нет открытого/очередного
      // попапа расхождения, не идёт оптимистичная привязка). Иначе откладываем — добьём из
      // closeMismatchPopup / колбэка привязки, когда условия станут чистыми.
      if (_orderInitDone) {
        if (!complete) _donePopupShown = false;                 // снова неполный → при добивании покажем снова
        else if (!_donePopupShown && canShowDone()) { _donePopupShown = true; showOrderDonePopup(); }
      }
      _orderComplete = complete;
    }

    // Попап «Заказ … успешно собран» (п.8): большая галка, сумма, список собранных вещей,
    // «Закрыть» (в меню склада) и «Исправить» (назад к заказу — что-то поправить).
    function showOrderDonePopup() {
      var pop = document.getElementById('order-done-popup');
      if (!pop || !ORDER) return;
      var noTxt = ORDER.orderNo || ORDER_NO || '';
      var nickTxt = ORDER.nick || ORDER_NICK || '';
      var sum = (ORDER.totalSum != null) ? ORDER.totalSum : 0;
      var cnt = (ORDER.totalCount != null) ? ORDER.totalCount : 0;
      var listHtml = (ORDER.items || []).filter(function (it) { return !it.hasNet; }).map(function (it) {
        var color = it.color || splitVariant(it.variant).color || '';
        var size  = cleanSize(it.size) || splitVariant(it.variant).size || '';
        var nm = it.nameRu || it.name || '';
        var cs = [color, size].filter(Boolean).join(' · ');
        return '<div class="odone-item">' + esc(it.num) + ' | ' + esc(nm)
          + (cs ? ' <span class="oi-attr">' + esc(cs) + '</span>' : '') + '</div>';
      }).join('');
      pop.innerHTML =
        '<div class="odone-panel">'
        + '<div class="odone-check">✅</div>'
        + '<div class="odone-title">Заказ ' + esc(noTxt) + ' успешно собран' + (nickTxt ? '<br>· ' + esc(nickTxt) + ' ·' : '') + '</div>'
        + '<div class="odone-sum">Сумма заказа: ' + esc(String(sum)) + ' € · ' + cnt + ' поз.</div>'
        + '<div class="odone-list">' + listHtml + '</div>'
        + '<div class="odone-btns">'
        +   '<button type="button" class="odone-close">Закрыть</button>'
        +   '<button type="button" class="odone-fix">Исправить</button>'
        + '</div></div>';
      pop.classList.add('show');
      pop.onclick = function (e) {
        e.stopPropagation();
        if (e.target.closest && e.target.closest('.odone-close')) { closeOrderDone(); return; }
        if (e.target.closest && e.target.closest('.odone-fix'))   { pop.classList.remove('show'); pop.innerHTML = ''; }
      };
    }

    function fetchOrderPhotos(items) {
      var seenN = {}, nums = [];
      items.forEach(function (it) { if (!seenN[it.num]) { seenN[it.num] = true; nums.push(it.num); } });
      if (!nums.length) return;
      callGas('order_photos', '', function (map) {
        if (!map) return;
        Array.prototype.forEach.call(document.querySelectorAll('#order-grid .obadge'), function (el) {
          var url = map[el.getAttribute('data-num')];
          if (!url) return;
          var th = el.querySelector('.othumb');
          var img = document.createElement('img'); img.alt = '';
          img.onerror = function () { th.innerHTML = '<div class="ph">📦</div>'; };
          img.src = url; th.innerHTML = ''; th.appendChild(img);
        });
      }, { src: SRC, nums: nums.join(',') });
    }

    function setStatus(kind, msg) {
      var box = document.getElementById('scan-status');
      box.className = 'show ' + kind;
      box.querySelector('.msg').textContent = msg;
      if (statusTimer) clearTimeout(statusTimer);
      statusTimer = setTimeout(function () {
        box.className = box.className.replace('show', '').replace(/\s+/g, ' ').trim();
      }, kind === 'bad' ? 6000 : 3500);
    }

    function shortName(data) {
      var cs = splitVariant(data.variant);
      var v = [cs.color, cs.size].filter(Boolean).join(' ');
      return (data.num || '') + ' ' + (data.name || '') + (v ? ' (' + v + ')' : '');
    }

    // === Скан в режиме заказа: без нижней ленты — результат на бейджиках + баннере + попапе ===
    var OP_BY_UID = {};       // uid → opId текущей операции выдачи (повтор шлёт ТОТ ЖЕ)
    function onScanOrder(text, t0) {
      t0 = t0 || perfNow();
      seen[text] = true;        // дедуп/повторное наведение уже обработаны в onScan (п.2а)
      beep();                   // нейтральный «код считан»; зелёный/красный поставит ответ сервера
      RETRY[text] = 0;
      OP_BY_UID[text] = newOpId('sell', text);
      IN_FLIGHT[text] = true;
      jrnAdd('sell', text, { no: ORDER_NO, src: SRC, nick: ORDER_NICK, op: OP_BY_UID[text] });
      var tSent = perfNow();
      callGas('sell', text, function (data) {
        delete IN_FLIGHT[text];
        dlog('выдача', text, {
          res: data ? (data.match || data.error || '?') : 'нет связи',
          net: perfNow() - tSent, total: perfNow() - t0, srv: data && data.t, dbg: data && data.dbg });
        handleSellResult(text, data);
      }, { no: ORDER_NO, src: SRC, nick: ORDER_NICK, op: OP_BY_UID[text] });
    }

    // Разбор ответа выдачи: совпало → зелёный бейджик + код; расхождение → попап выбора
    // позиции; лишнее/уже выдано → баннер; транзиентный сбой → тихий повтор (без карточки).
    function handleSellResult(uid, data) {
      delete IN_FLIGHT[uid];                       // ответ пришёл; неопределённые исходы вернут флаг ниже
      // Определённый исход — вычёркиваем из журнала смены; транзиентный оставляем (доделаем).
      if (data && data.error !== 'busy' && data.error !== 'not_in_log') jrnDone(OP_BY_UID[uid]);
      if (!data || data.error === 'busy' || data.error === 'not_in_log') {
        if (!data)                      setStatus('warn', 'Нет связи — повтор…');
        else if (data.error === 'busy') setStatus('warn', 'Склад занят — повтор…');
        else                            setStatus('warn', 'Наклейка ещё пишется — повтор…');
        scheduleRetrySell(uid);
        return;
      }
      // Сервер не смог подтвердить запись (сбой flush) — НЕ рисуем успех [MED-1].
      if (data.commitUncertain) {
        clearRetryFor(uid); delete OP_BY_UID[uid]; delete seen[uid];
        flashAimDup(); vibeDup();
        setStatus('bad', '⚠ Таблица не подтвердила запись по ' + codeFromUid(uid) +
                  '. ПРОВЕРЬТЕ заказ в таблице и отсканируйте заново.');
        return;
      }
      switch (data.match) {
        case 'ok':
          clearRetryFor(uid);                  // определённый исход ПО ЭТОЙ наклейке (чужие повторы не трогаем)
          delete OP_BY_UID[uid];
          flashAim(); vibeOk();                // ЗЕЛЁНЫЙ только здесь — по подтверждению сервера (HIGH-3)
          // ⚠️ Попап закрываем, ТОЛЬКО если он про ЭТУ наклейку [круг Кодекса 06.09.2026, CRIT-1].
          // Раньше успех вещи B гасил открытое окно ошибки вещи A и выкидывал A из seen: работница
          // видела зелёное и считала серию законченной, а вещь A уезжала в посылку без выдачи.
          closeMismatchPopupFor(uid);
          updateOrderBadge(data, true);
          setStatus('ok', '✓ ' + codeFromUid(uid) + ' ' + shortName(data) + (data.replayed ? ' (уже было записано)' : ''));
          break;
        case 'already':
          // наклейка УЖЕ была выдана раньше (в т.ч. в прошлой сессии) — это «уже сканировали»:
          // красная рамка + плашка + двойная вибрация (п.1). Бейджики НЕ трогаем (у ручной
          // привязки свой слот пуст — кредит ушёл назначенной позиции), только баннер.
          clearRetryFor(uid); delete OP_BY_UID[uid];
          flashAimDup(); showScanToast('Уже выдавали ранее'); vibeDup();
          // Бейджики ОБНОВЛЯЕМ и здесь [ревью Кодекса 06.09.2026, HIGH-4]: сервер прислал
          // авторитетное given, а раньше экран его игнорировал — заказ выглядел недособранным,
          // хотя на сервере он уже закрыт, и работник искал «пропавшую» вещь.
          if (data.given != null) updateOrderBadge(data, false);
          setStatus('warn', '⚠ Уже выдано раньше: ' + shortName(data));
          break;
        case 'overscan':
          // лишняя/другой размер того же товара: попап классифицирует сам (по незакрытым позициям
          // того же товара) — «размер не соответствует» либо «уже достаточно». Вне заказа — баннер.
          if (ORDER && ORDER.found) enqueueMismatch(data);
          else setStatus('bad', '✗ Лишняя штука: ' + shortName(data) + ' (нужно ' + (data.need || 0) + ')');
          break;
        case 'wrong_source':
          // ЖЁСТКИЙ отказ (внешнее ревью CRIT-2): наклейка из ДРУГОЙ закупки, без метки закупки,
          // либо уже выдана другому заказу. Никакого попапа замены и НИКАКОГО бейджа/«привязано» —
          // сервер операцию запретил заранее. Только красный баннер + вибро-дубль. Бейджики не
          // трогаем (позиция заказа остаётся незакрытой). Позволять «подобрать» такую вещь нельзя —
          // это прямой путь пересортицы (физтовар одной закупки закрыл бы заказ другой).
          clearRetryFor(uid); delete OP_BY_UID[uid];
          flashAimDup(); vibeDup();
          showScanToast(data.dupNum ? 'В каталоге две строки с этим №'
                      : data.error === 'mixed_orders' ? 'У клиента несколько заказов — откройте по номеру'
                      : data.issuedElsewhere ? 'Уже выдана другому заказу' : 'Из другой закупки');
          setStatus('bad', '✗ Не из этого заказа/закупки: ' + shortName(data) +
                    '. Проверьте каталог заказа или перепечатайте наклейку.');
          break;
        case 'wrong_order':
        case 'net_item':
          // Строка клиента ещё БЕЗ № заказа [круг Фейбла 06.09.2026, MED-1]: попап замены здесь
          // ВРЕДЕН — он предложит тикнуть чужую позицию, и вещь уйдёт не туда. Говорим прямо.
          if (data.unnumbered) {
            clearRetryFor(uid); delete OP_BY_UID[uid]; delete seen[uid];
            flashAimDup(); vibeDup();
            showScanToast('Строка без № заказа');
            setStatus('bad', '✗ ' + shortName(data) + ' — эта вещь у клиента есть, но её строка ещё '
                      + 'без № заказа. Проставьте № в «Собрать заказ» и отсканируйте снова.');
            break;
          }
          enqueueMismatch(data);               // «Товар отличается от заказа» — выбрать позицию (с очередью)
          break;
        default:
          if (data.error === 'item_missing') setStatus('bad', '✗ Нет на складе: ' + shortName(data));
          else setStatus('bad', '✗ Не найдено: ' + shortName(data));
      }
    }

    // Тихий повтор выдачи (транзиентные сбои) — без карточки, по uid. До 4 попыток.
    function scheduleRetrySell(uid) {
      RETRY[uid] = (RETRY[uid] || 0) + 1;
      if (RETRY[uid] > 4) {
        setStatus('bad', 'Не удалось учесть наклейку ' + codeFromUid(uid) + ' — отсканируйте её заново.');
        delete seen[uid]; delete RETRY_T[uid]; delete OP_BY_UID[uid]; delete IN_FLIGHT[uid];
        return;
      }
      IN_FLIGHT[uid] = true;                    // ждём повтора — исход по наклейке ещё не определён
      RETRY_T[uid] = setTimeout(function () {
        delete RETRY_T[uid];
        // ⚠️ ТОТ ЖЕ opId, что и у первой попытки [HIGH-4]: если сервер на самом деле успел
        // записать выдачу, а ответ не доехал, повтор получит ИСХОДНЫЙ результат и не задвоит.
        callGas('sell', uid, function (data) { handleSellResult(uid, data); },
                { no: ORDER_NO, src: SRC, nick: ORDER_NICK, op: OP_BY_UID[uid] || newOpId('sell', uid) });
      }, 2000);
    }
    // Снять повтор ТОЛЬКО у этой наклейки [ревью Кодекса 06.09.2026, CRIT-1].
    // Раньше здесь стоял clearPendingRetries(): успешный ответ по вещи B гасил отложенный повтор
    // вещи A и вычищал её из seen — у A не оставалось ни запроса, ни красного следа, а вещь уже
    // лежала в посылке. Общего гашения больше нет: каждая наклейка отвечает за себя.
    function clearRetryFor(uid) {
      if (!uid) return;
      if (RETRY_T[uid]) { try { clearTimeout(RETRY_T[uid]); } catch (e) {} delete RETRY_T[uid]; }
    }
    // Сколько наклеек ещё не получили ОПРЕДЕЛЁННОГО ответа [круг Кодекса 06.09.2026, MED-7].
    // Раньше считались только отложенные повторы и привязки — а обычный запрос выдачи, который
    // висит 4–7 секунд, не считался вовсе: работница успевала нажать «назад» и уйти с неизвестным
    // исходом. Теперь ключ живёт в IN_FLIGHT от отправки до определённого ответа.
    function pendingCount() {
      var n = {};
      Object.keys(IN_FLIGHT).forEach(function (k) { n[k] = 1; });
      Object.keys(RETRY_T).forEach(function (k) { n[k] = 1; });
      Object.keys(PENDING_ASSIGN).forEach(function (k) { n[k] = 1; });
      return Object.keys(n).length;
    }

    function sendUnsell(uid, el) {
      // МОМЕНТАЛЬНО гасим бейджик в «ждёт» (серый) + обновляем прогресс, само снятие шлём в ФОНЕ
      // (п.5: раньше бейджик долго висел зелёным, ждал ответ + перечитку → «нет связи»). Успех —
      // оставляем как есть; сбой — перечитываем заказ (откат к авторитетному состоянию) + ошибка.
      if (el) setBadgePending(el);
      updateOrderProgress();
      delete seen[uid];                        // снятую наклейку можно сканировать заново
      setStatus('ok', 'Выдача снята');
      dlog('снятие выдачи', uid, {});
      var tUnsell = perfNow();
      // Транспортные сбои повторяем сами [ревью Кодекса «живучесть», HIGH]: экран уже сказал
      // «Выдача снята», и молча оставить её несделанной нельзя.
      callGasRetry('unsell', uid, { no: RESOLVED_NO || ORDER_NO, src: SRC, nick: ORDER_NICK }, function (data) {
        delete IN_FLIGHT[uid];
        dlog('снятие выдачи', uid, { res: (data && data.ok) ? 'ок' : 'сбой', net: perfNow() - tUnsell, srv: data && data.t });
        if (!data || !data.ok) {
          // 'not_sold' сервер теперь отдаёт с ok:true — состояние «не выдано» достигнуто,
          // это успех [круг Кодекса 06.09.2026, MED-2], сюда он больше не попадает.
          // unsell_conflict (внешнее ревью CRIT-3): наклейку уже сняли и выдали другому заказу —
          // сервер НЕ стал стирать чужую актуальную выдачу. Перечитываем заказ к авторитетному
          // состоянию (наш оптимистичный серый бейджик откатится к реальному).
          setStatus('warn', (data && data.match === 'unsell_conflict')
            ? 'Крестик не применён: наклейка уже числится за другим заказом. Обновляю…'
            : 'Не удалось снять выдачу даже с трёх попыток (нет связи / склад занят). Обновляю заказ — проверьте.');
          reloadOrder();                       // откат к авторитетному состоянию сервера
        }
        // успех — бейджик уже серый; не перерисовываем (моментально и без мигания).
      });
    }

    // Очередь расхождений (п.2): при серийном скане несколько проблемных наклеек копятся,
    // показываем попапы по одному. Следующий всплывает сам, как только закрыли текущий.
    var MQUEUE = [];
    var _drainPending = false;                  // окно между закрытием попапа и показом следующего (60мс)
    function enqueueMismatch(data) {
      var pop = document.getElementById('mismatch-popup');
      // в очередь, если попап открыт ИЛИ уже запланирован показ следующего: иначе в 60мс-окне новый
      // попап открылся бы напрямую, а отложенный таймер затёр бы его и расхождение потерялось бы.
      if ((pop && pop.style.display !== 'none') || _drainPending) { MQUEUE.push(data); updateQueueNote(); return; }
      openMismatchPopup(data);
    }
    function updateQueueNote() {
      var pop = document.getElementById('mismatch-popup');
      if (!pop || pop.style.display === 'none') return;
      var q = pop.querySelector('.mpop-queue');
      if (q) q.textContent = MQUEUE.length ? ('Ещё не разобрано наклеек: ' + MQUEUE.length) : '';
    }

    // ─── Попап «Товар отличается от заказа» ───
    // Тикабельность: тот же № есть в заказе → частичное расхождение, тикать можно ТОЛЬКО
    // незакрытые позиции этого же № (подбор цвета/размера). Нет такого № → замена: тикать
    // можно любую незакрытую позицию. Уже выданные и «не хватило» — серые, недоступны.
    function openMismatchPopup(data) {
      var pop = document.getElementById('mismatch-popup');
      clearRetryFor(data.uid);                  // гасим повтор ТОЛЬКО этой наклейки (CRIT-1)
      if (pop.style.display !== 'none' && pop._uid && pop._uid !== data.uid) delete seen[pop._uid];  // прежнее расхождение бросаем
      var cs = splitVariant(data.variant);
      var scanNum = String(data.num || '');
      var name = (data.nameRu || data.name || '');
      var items = (ORDER && ORDER.items) || [];
      var scanName = String(name).trim().toLowerCase();
      // «Тот же товар» определяет СЕРВЕР (data.diffInfo.matchNums) — сверяет № и название по тому же
      // составу заказа, что использует для кредита (устойчиво к расхождению № наклейки и № в заказе).
      // САМУ причину (размер/цвет/товар) сканер считает ниже по НЕЗАКРЫТЫМ позициям того же товара
      // (server.kind не используем). Нет diffInfo (старый сервер) — запасное правило: № ЛИБО название.
      var server = data.diffInfo || null;
      var serverNums = (server && server.matchNums) || null;
      function itName(it) { return String((it.nameRu || it.name || '')).trim().toLowerCase(); }
      function sameProduct(it) {
        if (serverNums) return serverNums.indexOf(String(it.num)) >= 0;
        return String(it.num) === scanNum || (!!scanName && itName(it) === scanName);
      }

      // размер/цвет скана (best-effort) — для определения, ЧТО именно не совпало
      var scanColor = cs.color, scanSize = cs.size;
      // незакрытые позиции ТОГО ЖЕ товара — для сравнения цвет/размер
      var sameNum = [];
      items.forEach(function (it, i) {
        if (!sameProduct(it)) return;
        var el = document.querySelector('#order-grid .obadge[data-idx="' + i + '"]');
        if (el && el.getAttribute('data-done') === '1') return;
        if (it.hasNet || (el && el.getAttribute('data-net') === '1')) return;
        sameNum.push(it);
      });
      // КЛАССИФИКАЦИЯ по НЕЗАКРЫТЫМ позициям того же товара (sameNum: тот же №/название, ещё не
      // выданы и не «нет»). Если такие ЕСТЬ — скан это ТОТ ЖЕ товар, но его вариант их не закрывает.
      // Обычно: у наклейки размер ПУСТОЙ, а в заказе размер есть (напр. «koza») — всё в кол. J
      // заказа это РАЗМЕР, значит несовпадение РАЗМЕРНОЕ → «Размер не соответствует» + предлагаем
      // отметить нужную позицию. Если незакрытых позиций того же товара НЕТ → лишняя (overscan)
      // или другой товар — оба показываем как «товар не соответствует» (категория num, решение владельца).
      // overscan = этот товар В заказе, но нужного уже выдано достаточно. При overscan НИКОГДА не
      // предлагаем тикать ЧУЖИЕ позиции (анти-пересортица: лишнюю наклейку нельзя привязать к
      // другому товару) — только незакрытые позиции ТОГО ЖЕ товара (другой размер, напр. «koza»).
      var isOverscan = (data.match === 'overscan');
      var diffKind, treatAsNum;
      if (sameNum.length > 0) {
        // есть НЕЗАКРЫТЫЕ позиции того же товара (напр. размер «koza») → не совпал размер/цвет,
        // тикать можно ТОЛЬКО их (ручной подбор размера/цвета — анти-пересортица за работником).
        var colorMatch = false, sizeMatch = false;
        sameNum.forEach(function (it) {
          var oc = slugify(it.color || ''), os = slugify(cleanSize(it.size) || '');
          if (oc && oc === slugify(scanColor)) colorMatch = true;
          if (os && os === slugify(scanSize)) sizeMatch = true;   // у наклейки размер пустой → sizeMatch=false
        });
        diffKind = (colorMatch && !sizeMatch) ? 'size'
                 : (sizeMatch && !colorMatch) ? 'color' : 'both';
        treatAsNum = false;                              // тикать можно только позиции ТОГО ЖЕ товара (подбор размера)
      } else if (isOverscan) {
        // нет открытых позиций того же товара → вещь реально ЛИШНЯЯ. Ничего не тикаем, просим отложить.
        diffKind = 'enough';
        treatAsNum = false;
      } else {
        // wrong_order: товара нет в заказе → замена, тикать можно любую незакрытую позицию.
        diffKind = 'num';
        treatAsNum = true;
      }
      // Заголовки — СОГЛАСОВАННЫЕ 4 варианта (не выдумывать новых): товар / размер / цвет / оба.
      var mTitle = diffKind === 'size'   ? 'Размер отсканированного товара не соответствует заказанному'
                 : diffKind === 'color'  ? 'Цвет отсканированного товара не соответствует заказанному'
                 : diffKind === 'both'   ? 'Цвет и размер отсканированного товара не соответствует заказанному'
                 : diffKind === 'enough' ? 'Этого товара уже достаточно'
                 :                         'Отсканированный товар не соответствует заказанному';
      var hlName  = (diffKind === 'num');
      var hlColor = (diffKind === 'color' || diffKind === 'both');
      var hlSize  = (diffKind === 'size'  || diffKind === 'both');

      // список позиций заказа БЕЗ уже выданных (зелёных). У строк ТОГО ЖЕ номера подсвечиваем
      // жёлтым то, что отличается (размер/цвет) — чтобы было видно различие с заказом.
      var rows = items.map(function (it, i) {
        var el = document.querySelector('#order-grid .obadge[data-idx="' + i + '"]');
        if (el && el.getAttribute('data-done') === '1') return '';     // уже выдано — не показываем
        var net  = it.hasNet || !!(el && el.getAttribute('data-net') === '1');
        var color = it.color || splitVariant(it.variant).color || '';
        var size  = cleanSize(it.size) || splitVariant(it.variant).size || '';
        var nm = it.nameRu || it.name || '';
        var sameNumRow = sameProduct(it);
        var attr = csLinesHtml(color, size, { hlColor: hlColor && sameNumRow, hlSize: hlSize && sameNumRow });
        var pickable = !net && (treatAsNum ? true : sameProduct(it));
        var stateTxt = net ? '<div class="mob-state">не хватило</div>' : '';
        var cls = 'mob' + (pickable ? ' pick' : ' disabled') + (net ? ' net' : '');
        return '<div class="' + cls + '" data-idx="' + i + '"'
          + (pickable ? ' data-num="' + esc(it.num) + '" data-slug="' + esc(it.slug) + '"' : '')
          + '><div class="mob-thumb"><div class="ph">📦</div></div>'
          + '<div class="mob-meta"><div class="mob-name">' + esc(it.num) + ' | ' + esc(nm) + '</div>'
          +   '<div class="mob-attr">' + attr + '</div>' + stateTxt + '</div>'
          + '<div class="mob-check">' + (pickable ? '✓' : '') + '</div></div>';
      }).join('');

      // карточка скана: цвет/размер на отдельных строках; при размерном отличии показываем
      // «размер: без размера» (если у наклейки размера нет) и выделяем жёлтым.
      var scanAttr = csLinesHtml(scanColor, scanSize, { hlColor: hlColor, hlSize: hlSize, emptySize: hlSize });
      if (!scanAttr && data.variant) scanAttr = '<div class="cs-row">вариант: <span class="val">' + esc(data.variant) + '</span></div>';

      // несовпадения — жёлтым (это предупреждение, не «ошибка»); overscan — тоже жёлтым
      var titleCls = 'mpop-title warn';
      var nameHtml = '<div class="mname' + (hlName ? ' hl' : '') + '">' + esc(scanNum + (name ? ' | ' + name : '')) + '</div>';
      // подсказка (жёлтым) + заголовок списка «Клиент заказал:» (белым). При «уже достаточно»
      // (лишняя вещь) — тикать нечего: показываем только просьбу отложить, без списка позиций.
      var isEnough = (diffKind === 'enough');
      var hintHtml = isEnough
        ? '<div class="mpop-pick warn">Этого товара в заказе уже достаточно — отложите лишнюю вещь.</div>'
        : '<div class="mpop-pick warn">Сканируйте другой товар, либо отметьте галочкой этот товар в заказе клиента.</div>';
      var listHeading = isEnough ? '' : '<div class="mpop-pick">Клиент заказал:</div>';
      var emptyTxt = 'Нет подходящих позиций. Отсканируйте другой товар.';

      pop.innerHTML =
        '<div class="mpop-panel">'
        + '<div class="' + titleCls + '"><span class="x">⚠</span>' + esc(mTitle) + '</div>'
        + '<div class="mpop-pick">Вы отсканировали:</div>'
        + '<div class="mpop-scan"><div class="mphoto"><div class="ph">📦</div></div>'
        +   '<div class="minfo">' + nameHtml
        +     (scanAttr ? '<div class="mrow">' + scanAttr + '</div>' : '')
        +   '</div></div>'
        + hintHtml
        + listHeading
        + '<div class="mpop-list">' + (isEnough ? '' : (rows || '<div class="mpop-sub">' + esc(emptyTxt) + '</div>')) + '</div>'
        + '<div class="mpop-foot"><button type="button" class="mpop-close">Сканировать другой товар</button>'
        +   '<div class="mpop-queue"></div></div>'
        + '</div>';

      pop._uid = data.uid;
      pop.style.display = 'flex';
      updateQueueNote();                        // показать «ещё не разобрано N», если очередь не пуста
      // фото отсканированного товара (средний размер)
      if (data.photoUrl) {
        var mph = pop.querySelector('.mphoto');
        var mimg = document.createElement('img'); mimg.alt = '';
        mimg.onerror = function () { mph.innerHTML = '<div class="ph">📦</div>'; };
        mimg.src = data.photoUrl; mph.innerHTML = ''; mph.appendChild(mimg);
      }
      copyGridPhotosToPopup();                  // фото позиций берём из уже загруженной сетки
      pop.onclick = function (e) {
        e.stopPropagation();                                          // не запускать камеру под попапом
        if (e.target === pop) { closeMismatchPopup(true); return; }   // клик по фону — закрыть
        var row = e.target.closest ? e.target.closest('.mob.pick') : null;
        if (row) { row.classList.add('sel'); assignScanToOrder(pop._uid, row.getAttribute('data-num'), row.getAttribute('data-slug')); return; }
        if (e.target.closest && e.target.closest('.mpop-close')) closeMismatchPopup(true);
      };
    }

    // перенести уже загруженные фото позиций из сетки в попап (без повторной загрузки)
    function copyGridPhotosToPopup() {
      var pop = document.getElementById('mismatch-popup');
      Array.prototype.forEach.call(pop.querySelectorAll('.mob'), function (mob) {
        var i = mob.getAttribute('data-idx');
        var gimg = document.querySelector('#order-grid .obadge[data-idx="' + i + '"] .othumb img');
        if (gimg && gimg.getAttribute('src')) {
          var th = mob.querySelector('.mob-thumb');
          var img = document.createElement('img'); img.alt = '';
          img.onerror = function () { th.innerHTML = '<div class="ph">📦</div>'; };
          img.src = gimg.src; th.innerHTML = ''; th.appendChild(img);
        }
      });
    }

    // Закрыть попап расхождения ТОЛЬКО если он показывает именно эту наклейку. Чужой попап
    // трогать нельзя: он единственный след того, что та вещь не выдана [CRIT-1].
    function closeMismatchPopupFor(uid) {
      var pop = document.getElementById('mismatch-popup');
      if (!pop || pop.style.display === 'none') return;
      if (pop._uid && uid && pop._uid !== uid) return;      // окно про ДРУГУЮ наклейку — оставляем
      closeMismatchPopup(true);
    }
    function closeMismatchPopup(clearSeen) {
      var pop = document.getElementById('mismatch-popup');
      if (!pop || pop.style.display === 'none') return;
      if (clearSeen && pop._uid) delete seen[pop._uid];   // закрыли без привязки → можно пересканировать
      pop.style.display = 'none';
      pop.innerHTML = '';
      pop._uid = '';
      // в очереди есть ещё расхождения — показываем следующее (п.2). Отложенно, чтобы закрытие
      // успело примениться и не было гонки с обработчиком клика, который нас и вызвал. _drainPending
      // держит «занято» в это 60мс-окно, чтобы новое расхождение встало в очередь, а не затёрлось.
      if (MQUEUE.length) {
        _drainPending = true;
        var next = MQUEUE.shift();
        setTimeout(function () { _drainPending = false; openMismatchPopup(next); }, 60);
      } else if (_orderInitDone) {
        updateOrderProgress();                  // очередь пуста → возможно, пора показать отложенный «Заказ собран»
      }
    }

    // Тик по позиции в попапе → привязать наклейку к ней на сервере (action=assign).
    function assignScanToOrder(uid, anum, aslug) {
      if (!uid) return;
      // МОМЕНТАЛЬНО: закрываем попап и зажигаем выбранный бейджик зелёным СРАЗУ, а привязку на
      // сервере шлём в ФОНЕ. Если привязка ЗАКРЫВАЕТ заказ — попап «Заказ собран» показываем ТОЖЕ
      // сразу (п.4: раньше он ждал ответа сервера ~3с). При ОТКАЗЕ сервера — прячем попап «собран»
      // и перечитываем заказ (откат). Успех — оставляем как есть (без round-trip и мигания).
      clearRetryFor(uid);
      closeMismatchPopup(false);                          // привязано → seen НЕ чистим (наклейка выдана)
      // Бейджик зажигаем НЕЙТРАЛЬНЫМ «Сохраняю…», а не зелёной галкой [круг Кодекса 06.09.2026,
      // MED-9]: раньше работница видела подтверждение и клала вещь в посылку ещё до ответа, а
      // сервер через пару секунд мог отказать. Позиция всё так же занимается МГНОВЕННО (прогресс
      // считает её закрытой, скорость не потеряна) — меняется только цвет и подпись до ответа.
      var arr = BADGE_BY_SLOT[slotKey(anum, aslug)] || [];
      var savingEl = null;
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].getAttribute('data-done') !== '1') { setBadgeSaving(arr[i], uid); savingEl = arr[i]; break; }
      }
      var wasShown = _donePopupShown;
      updateOrderProgress();                              // прогресс + (если добрали) моментальный попап «Заказ собран»
      // НЕСКОЛЬКО ПРИВЯЗОК СРАЗУ [ревью Кодекса 06.09.2026, HIGH-5]: раньше «жду подтверждения»
      // был ОДНИМ булевым флагом — ответ по замене A гасил его, показывал «заказ собран» и
      // закрывал страницу, пока замена B была ещё в сети. Теперь считаем НЕПОДТВЕРЖДЁННЫЕ
      // наклейки поимённо: уйти можно, только когда список пуст.
      PENDING_ASSIGN[uid] = true; IN_FLIGHT[uid] = true;
      if (!wasShown && _donePopupShown) _doneAwaitAssign = true;
      setStatus('warn', 'Сохраняю привязку…');
      // Транспортные сбои повторяем сами [ревью Кодекса «живучесть», HIGH]: бейджик уже занят
      // этой наклейкой, и потерять привязку из-за одного обрыва нельзя.
      callGasRetry('assign', uid, { no: ORDER_NO, src: SRC, nick: ORDER_NICK, anum: anum, aslug: aslug },
        function (data) {
        // 'already' = ответ прошлой привязки потерялся при таймауте — на сервере уже верно.
        var done = data && (data.match === 'ok' || data.match === 'already') && !data.commitUncertain;
        delete PENDING_ASSIGN[uid]; delete IN_FLIGHT[uid];
        if (!done) {
          _doneAwaitAssign = false; _leaveAfterAssign = false;
          // ВНЯТНАЯ причина отказа (п.3) вместо глухого «не удалось привязать»: чаще всего слот
          // успели закрыть с другого устройства / попап устарел. reloadOrder обновит список,
          // наклейку освобождаем — можно отсканировать заново и увидеть актуальное состояние.
          var fm = data && data.match;
          var fmsg = (fm === 'overscan')     ? 'Этого товара уже достаточно — отложите лишнюю вещь.'
                   : (fm === 'wrong_order')  ? 'Эта позиция не из заказа — выберите другую.'
                   : (fm === 'wrong_source') ? (data.issuedElsewhere
                                                ? 'Наклейка уже выдана другому заказу — привязать нельзя.'
                                                : 'Наклейка из другой закупки — привязать к этому заказу нельзя.')
                   :                           'Не удалось привязать (' + ((data && (data.error || fm)) || 'нет связи') + '). Повторите.';
          setStatus('bad', fmsg);
          dlog('привязка', uid, { res: 'отказ', err: fm || (data && data.error) || 'нет связи', dbg: data && data.dbg });
          var dp = document.getElementById('order-done-popup');
          if (dp) { dp.classList.remove('show'); dp.innerHTML = ''; }   // прячем ошибочно показанный «собран»
          delete seen[uid];                               // дать пересканировать эту наклейку
          reloadOrder();                                  // откат к авторитетному состоянию сервера
        } else {
          if (savingEl) { savingEl.classList.remove('saving'); setBadgeDone(savingEl, uid); }
          dlog('привязка', uid, { res: 'ок' });
          // Ждать больше некого — только когда подтвердились ВСЕ привязки.
          if (!Object.keys(PENDING_ASSIGN).length) {
            _doneAwaitAssign = false;
            if (_leaveAfterAssign) leaveToWarehouse();    // работник нажал «Закрыть» — теперь безопасно уйти
          }
        }
        // успех — бейджик уже зелёный (и попап «собран» уже показан, если добрали); не перерисовываем.
      });
    }

    // auto=true — тихая попытка включить камеру при открытии страницы. Сработает,
    // если доступ к камере уже разрешён (iPhone запоминает разрешение для сайта).
    // Если нет — просто показываем кнопку, без красной ошибки (в первый раз iOS
    // требует включать камеру по нажатию). auto=false — нажали кнопку вручную.
    function start(auto) {
      showErr('');
      if (typeof Html5Qrcode === 'undefined') {
        if (!auto) showErr('Не удалось загрузить библиотеку сканера (нет интернета?).');
        startBtn.style.display = 'block';
        return;
      }
      if (qr) return;
      startBtn.style.display = 'none';        // прячем кнопку на время попытки
      qr = new Html5Qrcode('reader');
      qr.start(
        { facingMode: 'environment' },
        // qrbox = центральная область кадра (~70%): декодер обрабатывает не весь
        // кадр, а только центр (куда наводят QR) → заметно меньше нагрузка на телефон,
        // меньше пропусков при серийном скане. Наводить QR по-прежнему в рамку .aim.
        { fps: 10, qrbox: function (vw, vh) { var s = Math.floor(Math.min(vw, vh) * 0.7); return { width: s, height: s }; } },
        onScan,
        function () {}                       // ошибки отдельных кадров игнорируем
      ).then(function () {
        startBtn.style.display = 'none';
        aim.style.display = 'block';
      }).catch(function (e) {
        qr = null;
        document.getElementById('reader').innerHTML = '';   // чтобы блок схлопнулся
        aim.style.display = 'none';
        startBtn.style.display = 'block';     // не вышло — показываем кнопку
        if (!auto) showErr('Камера недоступна: ' + e + '. Разрешите доступ к камере для этого сайта.');
      });
    }

    startBtn.addEventListener('click', function () { start(false); });
    document.getElementById('clear').addEventListener('click', function () {
      listEl.innerHTML = ''; total = 0; accepted = 0; rejected = 0; seen = {}; renderReceiptCount();
      lastScanAt = {}; lastFreshAt = 0; dupCand = { text: null, at: 0, warned: false };   // сброс дедупа вместе с seen
      listEl.classList.remove('show-all'); updateShowAll();
    });

    renderReceiptCount();          // сразу показываем «Принято: 0 · считано: 0»
    jrnRestore();                  // доделать то, что не успели до перезагрузки страницы

    // Пробуем включить камеру сразу при открытии. Если доступ ещё не разрешён
    // (первый заход на iPhone) — покажется кнопка «Включить камеру».
    start(true);

    // iPhone не даёт включить камеру без касания страницы (правило Safari).
    // Поэтому касание В ЛЮБОМ месте экрана тоже включает камеру — не нужно
    // целиться в кнопку. start() сам ничего не делает, если камера уже идёт.
    document.addEventListener('click', function () { start(false); });

    // Режим «Собрать заказ»: подгрузить заказ и показать бейджики (камера уже стартует выше).
    if (MODE === 'order') initOrderMode();
  </script>
</body>
</html>
